<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BOSS RUSH: ULTRA ELITE</title>
<style>
html, body{
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
}

button, canvas, input, select, textarea{
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
}
body{
    margin:0;
    background:#050505;
    color:white;
    text-align:center;
    overflow:hidden;
    font-family:'Courier New',monospace;
}

canvas{
    background:#000;
    display:block;
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    margin:0;
    cursor:crosshair;
    border:4px solid #222;
    box-shadow:0 0 20px rgba(0,255,0,.1);
    width:900px;
    height:700px;
    box-sizing:border-box;
}

#ui{
    position:absolute;
    top:10px;
    width:100%;
    pointer-events:none;
    text-shadow:2px 2px #000;
    z-index:5;
}

.stat{
    font-weight:bold;
    font-size:1.2em;
}

#hp{color:#0f0}
#bhp{color:#f44}
#power{color:#ff0}

.label{
    color:#aaa;
    font-size:.8em;
    text-transform:uppercase;
}

#msg{
    position:absolute;
    bottom:20px;
    width:100%;
    color:#777;
    z-index:5;
}

#powerupScreen{
    display:none;
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.9);
    z-index:20;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

#powerupScreen h2{
    color:#0f0;
    font-size:32px;
    margin-bottom:8px;
}

#powerupChoices{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    justify-content:center;
    max-width:850px;
}

.powerChoice{
    width:210px;
    min-height:150px;
    border:2px solid #555;
    background:#111;
    color:white;
    padding:15px;
    cursor:pointer;
    font-family:inherit;
    transition:.15s;
}

.powerChoice:hover{
    border-color:#0f0;
    background:#182018;
    transform:translateY(-5px);
}

.powerChoice strong{
    display:block;
    color:#0f0;
    font-size:19px;
    margin-bottom:10px;
}

.powerChoice span{
    color:#aaa;
    font-size:14px;
}


#mainMenu{
    position:fixed;
    left:0;
    top:0;
    right:0;
    bottom:0;
    inset:0;
    background:rgba(0,0,0,.94);
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

#mainMenu h1{
    font-size:46px;
    letter-spacing:6px;
    color:#0f0;
    margin:0 0 10px;
    text-shadow:0 0 18px rgba(0,255,0,.35);
}

#mainMenu p{
    color:#777;
    margin:0 0 28px;
}

/* The game itself is hidden until a mode is selected. */
body.menuOpen canvas,
body.menuOpen #ui,
body.menuOpen #msg,
body.menuOpen #mobileToggle,
body.menuOpen #mobileControls{
    display:none !important;
}

.menuButton{
    width:300px;
    padding:16px;
    margin:7px;
    border:2px solid #444;
    background:#111;
    color:#fff;
    font:20px 'Courier New',monospace;
    cursor:pointer;
}

.menuButton:hover{
    border-color:#0f0;
    background:#182018;
}

#sandboxMenu{
    display:none;
    position:fixed;
    top:15px;
    right:15px;
    width:250px;
    padding:14px;
    background:rgba(8,8,8,.94);
    border:2px solid #444;
    z-index:30;
    text-align:left;
    box-sizing:border-box;

#sandboxMenu h2{
    margin:0 0 12px;
    color:#0f0;
    font-size:19px;
}

#sandboxMenu label{
    display:block;
    color:#aaa;
    font-size:12px;
    margin:9px 0 4px;
}

#sandboxMenu select,
#sandboxMenu button{
    width:100%;
    box-sizing:border-box;
    padding:9px;
    background:#111;
    color:#fff;
    border:1px solid #555;
    font:13px 'Courier New',monospace;
}

#sandboxMenu button{
    margin-top:7px;
    cursor:pointer;
}

#sandboxMenu button:hover{
    border-color:#0f0;
}

#sandboxMenu .sandboxDanger{
    color:#f88;
}


#mobileToggle{
    position:fixed;
    top:12px;
    left:12px;
    z-index:40;
    padding:10px 14px;
    background:#111;
    color:#fff;
    border:2px solid #555;
    font:bold 14px 'Courier New',monospace;
    cursor:pointer;
    display:block;
}

#mobileDashButton{
    position:absolute;
    left:50%;
    bottom:28px;
    transform:translateX(-50%);
    width:105px;
    height:105px;
    border:3px solid rgba(255,255,255,.45);

    background:rgba(255,255,255,.08);

    font:bold 15px 'Courier New',monospace;
    pointer-events:auto;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
}
#mobileDashButton:active{transform:translateX(-50%) scale(.94);border-color:#0ff;}

#mobileControls{
    display:none;
    position:fixed;
    inset:0;
    z-index:35;
    pointer-events:none;
}

#mobileControls.enabled{display:block;}

#mobileJoystick{
    position:absolute;
    left:24px;
    bottom:24px;
    width:150px;
    height:150px;
    border:3px solid rgba(255,255,255,.45);
    border-radius:50%;
    background:rgba(255,255,255,.08);
    pointer-events:auto;
    touch-action:none;
}

#mobileStick{
    position:absolute;
    width:62px;
    height:62px;
    left:44px;
    top:44px;
    border-radius:50%;
    background:rgba(0,255,0,.35);
    border:2px solid #0f0;
}

#mobileAim{
    position:absolute;
    right:24px;
    bottom:24px;
    width:150px;
    height:150px;
    border-radius:50%;
    background:rgba(0,200,255,.12);
    border:3px solid #4dd;
    pointer-events:auto;
    touch-action:none;
    user-select:none;
}

#mobileAim::after{
    content:"AIM + FIRE";
    position:absolute;
    left:0;
    right:0;
    bottom:18px;
    text-align:center;
    font:bold 11px 'Courier New',monospace;
    color:#9ee;
    pointer-events:none;
}

#mobileAimStick{
    position:absolute;
    width:62px;
    height:62px;
    left:44px;
    top:44px;
    border-radius:50%;
    background:rgba(0,200,255,.35);
    border:2px solid #4dd;
    box-sizing:border-box;
    pointer-events:none;
    transform:translate(0,0);
}

@media (max-width:700px){
    #mobileToggle{display:block;}
    #ui{font-size:11px;}
    #ui h1{font-size:18px;margin:8px 0;}
    #sandboxMenu{top:48px;right:8px;width:220px;}
}

</style>

        [0,1,2,5,7,9,10],[0,2,4,7,8,10],[0,3,4,6,8,9,11]
    ];

function ensureAudio(){
    if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;audioCtx=new AC();}
    if(audioCtx.state!=="running") audioCtx.resume().catch(()=>{});
    return true;
}
function noteFreq(root,n){return root*Math.pow(2,n/12);}
function playTone(freq,duration,volume,type,when,attack=.008,release=.04,detune=0){
    if(!audioCtx)return;
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,when);o.detune.setValueAtTime(detune,when);
    g.gain.setValueAtTime(.0001,when);g.gain.linearRampToValueAtTime(volume,when+attack);
    g.gain.exponentialRampToValueAtTime(.0001,when+Math.max(attack+.01,duration-release));
    o.connect(g);g.connect(musicBus||audioCtx.destination);o.start(when);o.stop(when+duration+.03);
}
function noiseHit(when,volume,duration){
    if(!audioCtx)return;
    const buffer=audioCtx.createBuffer(1,Math.max(1,Math.floor(audioCtx.sampleRate*duration)),audioCtx.sampleRate),data=buffer.getChannelData(0);
    for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,2.4);
    const src=audioCtx.createBufferSource(),g=audioCtx.createGain();src.buffer=buffer;
    g.gain.setValueAtTime(volume,when);g.gain.exponentialRampToValueAtTime(.0001,when+duration);
    src.connect(g);g.connect(musicBus||audioCtx.destination);src.start(when);
}
function playKick(when,v=.07){playTone(150,.17,v,"sine",when,.002,.08);}
function playSnare(when,v=.035){noiseHit(when,v,.12);}
function playHat(when,v=.014){noiseHit(when,v,.045);}
function playTom(when,v=.028){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="triangle";o.frequency.setValueAtTime(180,when);o.frequency.exponentialRampToValueAtTime(80,when+.11);g.gain.setValueAtTime(v,when);g.gain.exponentialRampToValueAtTime(.0001,when+.13);o.connect(g);g.connect(musicBus||audioCtx.destination);o.start(when);o.stop(when+.15);}
function playPluck(freq,when,v=.025){playTone(freq,.16,v,"square",when,.002,.09);playTone(freq*2,.10,v*.28,"triangle",when,.002,.06);}
function playArp(freq,duration,v,when){playTone(freq,duration,v,"square",when,.003,.025,-5);playTone(freq,duration,v*.35,"sawtooth",when,.003,.025,5);}

function stopMusic(){
    musicGeneration++;
    if(musicTimer){clearInterval(musicTimer);musicTimer=null;}
    currentMusicKey="";
    if(audioCtx&&musicBus){
        const oldBus=musicBus;
        const now=audioCtx.currentTime;
        oldBus.gain.cancelScheduledValues(now);
        oldBus.gain.setValueAtTime(Math.max(.0001,oldBus.gain.value),now);
        oldBus.gain.exponentialRampToValueAtTime(.0001,now+.035);
        setTimeout(()=>{try{oldBus.disconnect();}catch(e){}},80);
    }
    musicBus=null;
}

function startMusic(theme,key){
    desiredMusicTheme=theme;desiredMusicKey=key;
    if(!ensureAudio())return;
    if(audioCtx.state==="suspended"){
        audioCtx.resume().then(()=>{
            if(desiredMusicKey===key && desiredMusicTheme===theme) startMusic(theme,key);
        }).catch(()=>{});
        return;
    }
    if(audioCtx.state!=="running")return;
    if(currentMusicKey===key&&musicTimer)return;
    stopMusic();
    currentMusicKey=key;musicStep=0;
    musicBus=audioCtx.createGain();
    const now=audioCtx.currentTime;
    musicBus.gain.setValueAtTime(.0001,now);
    musicBus.gain.exponentialRampToValueAtTime(.55,now+.05);
    musicBus.connect(audioCtx.destination);
    const gen=musicGeneration;
    const [bpm,root,scale,melody]=theme;
    const bossIndex=key.startsWith("boss")?parseInt(key.slice(4),10):-1;
    const stepSec=60/bpm/4;
    const register=[0,12,-12,0,24,-24,12,-12,0,24,-12,12,-24,0,24,-12,12,-24,0,24,-12,12,-24,0,12,-12][Math.max(0,bossIndex)%26]||0;
    let nextTime=now+.08;
    let scheduledStep=0;

    function scheduleStep(s,when){
        const section=Math.floor(s/melody.length)%64;
        const local=s%melody.length;
        const beat=s%16;
        const idx=melody[local];
        const d=stepSec;
        const highSection=(section===3||section===7||section===11||section===15||section===31||section===47||section===63);
        const leadOct=(highSection?12:0)+register;
        const lead=noteFreq(root,scale[idx%scale.length]+leadOct);
        const bass=noteFreq(root,scale[Math.floor(s/4)%scale.length]-12+Math.floor(register/24)*12);
        const chord=noteFreq(root,scale[(Math.floor(s/8)*2+section)%scale.length]+12+register/2);
        const arp=noteFreq(root,scale[(s*3+section+Math.max(0,bossIndex))%scale.length]+12+register/2);

        /* Restored full 8-bit/pixel instrument layer. */
        playTone(lead,d*1.25,.065,"square",when,.002,.04,(s%4===0?-4:4));
        if(s%4===2) playPluck(noteFreq(root,scale[(idx+2+section+bossIndex)%scale.length]+12+register/2),when,.024);
        if(s%8===0){
            playTone(chord,d*7,.020,"triangle",when,.025,.15);
            playTone(chord*1.5,d*5,.010,"sawtooth",when,.02,.12,7);
        }
        if(s%4===0){
            playTone(bass,d*3.2,.050,"triangle",when,.008,.08);
            if(section%8===3||section%8===7) playTone(bass*2,d*1.5,.022,"square",when,.004,.05);
        }
        if(s%2===1) playArp(arp,d*.72,.024,when);
        if(beat===0||beat===8||(section%4===3&&beat===14)) playKick(when,.075);
        if(beat===4||beat===12) playSnare(when,.038);
        if(s%2===0) playHat(when,.014);
        if(beat===10||(section%4===3&&beat===15)) playTom(when,.028);
        if(beat===15) playTone(noteFreq(root,scale[(idx+3)%scale.length]+24),d*.9,.024,"square",when,.002,.06);

        /* The original dedicated SNIPER pixel composition is restored. */
        if(bossIndex===0){
            const sniper=[0,3,5,7,10,7,5,3,0,5,7,10,12,10,7,5,3,7,10,12,14,12,10,7,5,3,5,7,10,12,10,7];
            const sn=sniper[(local+(section*3))%sniper.length];
            const sf=noteFreq(root,scale[sn%scale.length]+24);
            playTone(sf,d*.82,.095,"square",when,.002,.025,(s%4===0?-9:9));
            if(s%2===0) playTone(noteFreq(root,scale[(sn+2)%scale.length]+12),d*.8,.055,"triangle",when,.003,.06);
            if(s%4===1) playTone(noteFreq(root,scale[(sn+4)%scale.length]+24),d*.42,.045,"sawtooth",when,.001,.02);
            if(s%8===0) playArp(noteFreq(root,scale[(sn+1)%scale.length]+12),d*.6,.04,when);
            if(beat===0||beat===6||beat===8||beat===14) playKick(when,.105);
            if(beat===3||beat===11) playSnare(when,.06);
            if(s%2===0) playHat(when,.022);
        }
    }

    function scheduler(){
        if(gen!==musicGeneration||currentMusicKey!==key){
            if(musicTimer){clearInterval(musicTimer);musicTimer=null;}
            return;
        }
        if(!audioCtx||audioCtx.state!=="running")return;
        while(nextTime<audioCtx.currentTime+1.2){
            scheduleStep(scheduledStep,nextTime);
            scheduledStep++;
            nextTime+=stepSec;
            musicStep=scheduledStep%melody.length;
        }
    }
    scheduler();
    musicTimer=setInterval(scheduler,80);
}

function fitCanvasToScreen(){
    // Fit the complete canvas (including its border) inside the viewport
    // while preserving the exact 900:700 game aspect ratio.
    const maxW=Math.max(1,window.innerWidth-8);

    canvas.style.width=Math.floor(900*scale)+"px";
    canvas.style.height=Math.floor(700*scale)+"px";
}

function getAngleToPlayer(origin,leadFactor=0){

    const targetX=player.x+(player.vx||0)*leadFactor;
    const targetY=player.y+(player.vy||0)*leadFactor;

    return Math.atan2(
        targetY-origin.y,
        targetX-origin.x
    );
}

function fireBullet(
    x,y,angle,speed,color,size=4,bounce=0,damage=5
){
    enemyBullets.push({
        x,y,
        dx:Math.cos(angle),
        dy:Math.sin(angle),
        speed,
        color,
        size,
        bounce,
        damage
    });
}

function aimSpread(
    origin,
    count,
    spread,
    speed,
    color,
    size=5,
    damage=5
){

    const base=getAngleToPlayer(origin,8);

    for(let i=0;i<count;i++){

        const offset=
            count===1
            ?0
            :(i-(count-1)/2)*spread;

        fireBullet(
            origin.x,
            origin.y,
            base+offset,
            speed,
            color,
            size,
            0,
            damage
        );
    }
}

function hazardHit(h,px=player.x,py=player.y){
    if(h.type==='lightning') return Math.abs(px-h.x)<h.width/2 && Math.abs(py-h.y)<h.height/2;
    if(h.type==='ring') return Math.abs(Math.hypot(px-h.x,py-h.y)-h.r)<h.thickness;
    if(h.type==='beam'){
        const dx=px-h.x,dy=py-h.y,c=Math.cos(h.angle),ss=Math.sin(h.angle);
        return Math.abs(dx*ss-dy*c)<h.width/2 && dx*c+dy*ss>0 && dx*c+dy*ss<h.length;
    }
    if(h.type==='fire') return Math.hypot(px-h.x,py-h.y)<h.r;
    if(h.type==='slow') return Math.hypot(px-h.x,py-h.y)<h.r;
    if(h.type==='gravity') return Math.hypot(px-h.x,py-h.y)<h.r;
    if(h.type==='sweep') { const pos=h.center+(h.amp*Math.sin(h.timer*h.freq)); return h.axis==='v' ? Math.abs(px-pos)<h.width/2 : Math.abs(py-pos)<h.width/2; }
    if(h.type==='meteor') return Math.hypot(px-h.x,py-h.y)<h.r;
    if(h.type==='spikes') return px>h.x-h.w/2 && px<h.x+h.w/2 && py>h.y-h.h/2 && py<h.y+h.h/2;
    if(h.type==='blade') return Math.hypot(px-h.x,py-h.y)<h.r;
    if(h.type==='wall') return px>h.x-h.w/2 && px<h.x+h.w/2 && py>h.y-h.h/2 && py<h.y+h.h/2;
    if(h.type==='mine') return Math.hypot(px-h.x,py-h.y)<h.r;
    if(h.type==='blink') return Math.hypot(px-h.x,py-h.y)<h.r;
    if(h.type==='freeze') return Math.hypot(px-h.x,py-h.y)<h.r;
    if(h.type==='shrink') return px<h.x || px>canvas.width-h.x || py<h.x || py>canvas.height-h.x;
    if(h.type==='crossbeam'){
        const a=h.angle, c=Math.cos(a), ss=Math.sin(a), dx=px-h.x,dy=py-h.y;
        return Math.abs(dx*ss-dy*c)<18 || Math.abs(dx*c+dy*ss)<18;
    }
    return false;
}

function bossChase(b){
    /* Every boss actively chases the player. Larger bosses are slower. */
    const dx=player.x-b.x, dy=player.y-b.y;
    const d=Math.hypot(dx,dy)||1;
    const speed=(b.name==="THE APOCALYPSE")?0.62:Math.max(0.75,Math.min(2.8,3.25-b.size*0.022));
    if(d>2){
        b.x += dx/d*speed;
        b.y += dy/d*speed;
    }
    const edge=Math.max(20,b.size/2);
    b.x=Math.max(edge,Math.min(canvas.width-edge,b.x));
    b.y=Math.max(edge,Math.min(canvas.height-edge,b.y));
}

function updateBossHazards(){
    for(let i=bossHazards.length-1;i>=0;i--){
        const h=bossHazards[i];
        h.timer++;
        if(h.hitCooldown>0) h.hitCooldown--;
        h.angle+=h.spin;
        h.x+=h.vx; h.y+=h.vy;
        if(h.type==='bulletWarn' && h.timer>=h.warning && !h.armed){
            h.armed=true;
            if(typeof h.fireFn==='function') h.fireFn();
        }
        if(h.type==='gravity' && h.timer>h.warning){
            const dx=h.x-player.x,dy=h.y-player.y,d=Math.hypot(dx,dy)||1;
            if(d<h.r) { player.x+=dx/d*1.7; player.y+=dy/d*1.7; }
        }
        if(h.type==='blade' && (h.x<30||h.x>870)) h.vx*=-1;
        if(h.type==='blade' && (h.y<30||h.y>670)) h.vy*=-1;
        if(h.type==='wall' && h.gap!=null){
            // The wall is solid except for a moving-sized opening around the gap.
            h.holeY=h.gap+Math.sin(h.timer*.035)*150;
        }
        if(h.timer>h.warning && h.hitCooldown===0 && hazardHit(h)){
            hurtPlayer(h.damage);
            h.hitCooldown=35;
        }
        if(h.timer>=h.life) bossHazards.splice(i,1);
    }
}

function drawBossHazards(){
    bossHazards.forEach(h=>{
        const active=h.timer>=h.warning;
        const pulse=1+Math.sin(h.timer*.25)*.12;
        ctx.save();
        ctx.globalAlpha=active?0.8:0.35+(Math.sin(h.timer*.3)*.15);
        ctx.strokeStyle=h.color; ctx.fillStyle=h.color; ctx.shadowColor=h.color; ctx.shadowBlur=active?18:8;
        if(h.type==='bulletWarn'){
            ctx.translate(h.x,h.y);ctx.rotate(h.angle);
            ctx.globalAlpha=0.25+0.15*Math.sin(h.timer*.35);
            ctx.fillRect(-h.length/2,-Math.max(2,h.width/2),Math.max(4,h.length),Math.max(4,h.width));
            ctx.beginPath();ctx.arc(0,0,8+Math.sin(h.timer*.3)*3,0,Math.PI*2);ctx.stroke();
        }else if(h.type==='lightning'){
            ctx.fillRect(h.x-h.width/2,0,h.width,canvas.height);
            if(!active){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(h.x-h.width/2,0,h.width,canvas.height);}
        }else if(h.type==='ring'){
            ctx.lineWidth=h.thickness; ctx.beginPath(); ctx.arc(h.x,h.y,h.r,0,Math.PI*2); ctx.stroke();
        }else if(h.type==='beam'){
            ctx.translate(h.x,h.y);ctx.rotate(h.angle);ctx.fillRect(0,-h.width/2,h.length,h.width);
        }else if(h.type==='fire'||h.type==='slow'||h.type==='gravity'||h.type==='meteor'||h.type==='mine'||h.type==='blink'||h.type==='freeze'){
            ctx.beginPath();ctx.arc(h.x,h.y,h.r*pulse,0,Math.PI*2);ctx.fill();
            ctx.globalAlpha=0.55;ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,Math.PI*2);ctx.stroke();
        }else if(h.type==='sweep'){
            const pos=h.center+h.amp*Math.sin(h.timer*h.freq);
            if(h.axis==='v') ctx.fillRect(pos-h.width/2,0,h.width,canvas.height);
            else ctx.fillRect(0,pos-h.width/2,canvas.width,h.width);
        }else if(h.type==='spikes'){
            ctx.fillRect(h.x-h.w/2,h.y-h.h/2,h.w,h.h);
            ctx.globalAlpha=.9;ctx.strokeRect(h.x-h.w/2,h.y-h.h/2,h.w,h.h);
        }else if(h.type==='blade'){
            ctx.translate(h.x,h.y);ctx.rotate(h.timer*.12);ctx.beginPath();for(let k=0;k<8;k++){const a=k*Math.PI/4;ctx.lineTo(Math.cos(a)*(k%2?h.r*.35:h.r),Math.sin(a)*(k%2?h.r*.35:h.r));}ctx.closePath();ctx.fill();
        }else if(h.type==='wall'){
            const hole=h.holeY??h.gap;ctx.fillRect(h.x-h.w/2,h.y-h.h/2,h.w,hole-h.h/2-70);ctx.fillRect(h.x-h.w/2,hole+70-h.h/2,h.w,h.h-(hole-h.h/2-70));
        }else if(h.type==='shrink'){
            const inset=h.x+Math.sin(h.timer*.05)*8;ctx.lineWidth=12;ctx.strokeRect(inset,inset,canvas.width-inset*2,canvas.height-inset*2);
        }else if(h.type==='crossbeam'){
            ctx.translate(h.x,h.y);ctx.rotate(h.angle);ctx.fillRect(-450,-18,900,36);ctx.rotate(Math.PI/2);ctx.fillRect(-450,-18,900,36);
        }
        // Visual warning only: no warning text.
        ctx.restore();
    });
}

    /* TIDAL SURGE: alternating walls with a moving safe gap */
    if(this.timer%105===0){

        const gap=Math.floor((this.timer/105)%9);
        const fromLeft=Math.floor(this.timer/105)%2===0;

        for(let i=0;i<9;i++){
            if(i===gap) continue;

            const y=i*80+40;
            fireBullet(
                fromLeft ? -10 : 910,
                y,
                fromLeft ? 0 : Math.PI,
                5.8,
                "#09f",
                8,
                0,
                7
            );
        }
    }

    /* The gap shifts again, so staying in one place is dangerous */
    if(this.timer%105===52){

        const gap=8-Math.floor((this.timer/105)%9);
        const fromLeft=Math.floor(this.timer/105)%2===1;

        for(let i=0;i<9;i++){
            if(i===gap) continue;

            const y=i*80+40;
            fireBullet(
                fromLeft ? -10 : 910,
                y,
                fromLeft ? 0 : Math.PI,
                6.2,
                "#55bbff",
                8,
                0,
                7
            );
        }
    }

    /* Homing spray between the waves */
    if(this.timer%70===0){
        const a=getAngleToPlayer(this);
        aimSpread(this,7,.16,7,"#b9ecff",5);
        fireBullet(this.x,this.y,a,6.5,"#ffffff",7,0,6);

    /* A pulsing vertical breaker makes the center unsafe too */
    if(this.timer%160===0){
        const x=100+((this.timer/160)%7)*100;
        for(let j=0;j<6;j++){
            fireBullet(x,j*120+20,Math.PI/2,4.8,"#00ccff",7,0,6);

/* =========================================================
   MINION SPAWNING
========================================================= */

function spawnMinion(typeIndex=currentBossIndex){

    if(!boss && !sandboxMode)
        return;

    const type=minionTypes[typeIndex];

    if(!type)
        return;

    let x=0;
    let y=0;

    const margin=28;
    x=margin+Math.random()*(canvas.width-margin*2);
    y=margin+Math.random()*(canvas.height-margin*2);

    const scale=
        currentBossIndex>=15
        ?1.12
        :1;

    minions.push({

        ...type,

        x:x,
        y:y,

        hp:Math.round(type.hp*scale),
        maxHp:Math.round(type.hp*scale),

        timer:0,
        contactCooldown:0,
        splitDone:false,

        angle:Math.random()*Math.PI*2,
        targetX:x,
        targetY:y,

        dx:Math.cos(Math.random()*Math.PI*2),
        dy:Math.sin(Math.random()*Math.PI*2),
        warningTimer:0
    });
}


/* =========================================================
   MINION BULLET HELPERS
========================================================= */

function minionShoot(m){

    fireBullet(
        m.x,
        m.y,
        getAngleToPlayer(m,6),
        5.5,
        m.color,
        5,
        0,
        5
    );
}


/* =========================================================
   MINION UPDATE
========================================================= */

function updateMinion(m){

    m.timer++;

    if(m.warningTimer>0)
        m.warningTimer--;

    if(m.contactCooldown>0)
        m.contactCooldown--;


    /* 26-40: boss-specific drones now use unique bullets only. */
    if(m.kind==="newDrone"){
        const v=m.variant||0;
        const a=getAngleToPlayer(m);
        m.x+=(player.x-m.x)*0.003;
        m.y+=(player.y-m.y)*0.003;
        if(v===14){
            /* Apocalypse drone starts a new attack every second. Existing
               projectiles remain, so its attacks intentionally stack. */
            const attack=Math.floor(m.timer/60)%25;
            if(m.timer%60===0){
                const s=.72;
                switch(attack){
                    case 0: for(let i=0;i<4;i++) fireUniqueBullet(m.x,m.y,a+(i-1.5)*.20,5*s,m.color,5,6,'split'); break;
                    case 1: for(let i=0;i<6;i++) fireUniqueBullet(m.x,m.y,i*Math.PI/3,4.5*s,m.color,4,5,'orbit'); break;
                    case 2: for(let i=0;i<3;i++) fireUniqueBullet(m.x,m.y,a+(i-1)*.24,5*s,m.color,5,6,'zigzag'); break;
                    case 3: fireUniqueBullet(m.x,m.y,a,4*s,m.color,8,8,'heavy'); break;
                    case 4: fireUniqueBullet(m.x,m.y,a-.22,4.5*s,m.color,5,6,'sine'); fireUniqueBullet(m.x,m.y,a+.22,4.5*s,m.color,5,6,'sine'); break;
                    case 5: fireUniqueBullet(m.x,m.y,a,4.5*s,m.color,5,6,'homing'); break;
                    case 6: for(let y=70;y<700;y+=105) fireUniqueBullet(m.x,m.y,Math.atan2(y-m.y,player.x-m.x),4*s,m.color,4,5,'wave'); break;
                    case 7: fireUniqueBullet(m.x,m.y,a,3.2*s,m.color,7,7,'mine',{life:210}); break;
                    case 8: fireUniqueBullet(m.x,m.y,a,4.5*s,m.color,5,6,'ricochet',{bounce:3}); break;
                    case 9: fireUniqueBullet(m.x,m.y,a,4*s,m.color,5,6,'boomer',{life:240}); break;
                    case 10: fireUniqueBullet(m.x,m.y,a,4*s,m.color,5,6,'reverse'); break;
                    case 11: for(let i=0;i<5;i++) fireUniqueBullet(m.x,m.y,a+(i-2)*.18,4.5*s,m.color,5,6,'burst'); break;
                    case 12: fireUniqueBullet(m.x,m.y,a,4*s,m.color,5,6,'teleport'); break;
                    case 13: for(let i=0;i<6;i++) fireUniqueBullet(m.x,m.y,i*Math.PI/3,4*s,m.color,4,5,'spiral',{turn:(i%2?-.022:.022)}); break;
                    case 14: for(let i=0;i<6;i++) fireBullet(m.x,m.y,i*Math.PI/3,4*s,m.color,4); break;
                    case 15: fireBullet(m.x,m.y,a,4*s,m.color,6); break;
                    case 16: for(let i=0;i<5;i++) fireBullet(m.x,m.y,a+(i-2)*.16,4.2*s,m.color,5); break;
                    case 17: fireBullet(player.x,0,Math.PI/2,7*s,m.color,7); break;
                    case 18: for(let i=0;i<6;i++) fireBullet(m.x,m.y,i*Math.PI/3+m.timer*.04,4*s,m.color,4); break;
                    case 19: for(let i=0;i<4;i++) fireBullet(m.x,m.y,a+(i-1.5)*.18,4*s,m.color,5); break;
                    case 20: for(let i=0;i<5;i++) fireBullet(m.x,m.y,i*Math.PI*2/5,3*s,m.color,6); break;
                    case 21: fireBullet(0,m.y,0,4*s,m.color,6); fireBullet(900,m.y,Math.PI,4*s,m.color,6); break;
                    case 22: fireBullet(m.x,m.y,a,4.5*s,m.color,5); fireBullet(m.x,m.y,a+Math.PI,3.2*s,m.color,4); break;
                    case 23: for(let i=0;i<6;i++) fireBullet(m.x,m.y,i*Math.PI/3+m.timer*.06,4*s,m.color,5); break;
                    case 24: for(let i=0;i<8;i++) fireUniqueBullet(m.x,m.y,i*Math.PI/4,3*s,m.color,5,5,'apocalypse-ultimate'); break;
                }
            }
            return;
        }
        /* 26-40 drones: each has its own signature attack identity. */
        if(m.timer%70===0){
            switch(v){
                case 0: // STORM HERALD
                    for(let i=-1;i<=1;i++) fireUniqueBullet(m.x,m.y,a+i*.22,6.2,m.color,5,7,'thunder',{life:150});
                    break;
                case 1: // CARNIVAL ORB
                    for(let i=0;i<8;i++) fireUniqueBullet(m.x,m.y,i*Math.PI/4+m.timer*.03,4.5,m.color,5,6,'ring',{life:190});
                    break;
                case 2: // PRISM LANCE
                    fireUniqueBullet(m.x,m.y,a,8.2,m.color,9,9,'beam',{life:130});
                    break;
                case 3: // EMBER WYRM
                    for(let i=-2;i<=2;i++) fireUniqueBullet(m.x,m.y,a+i*.18,6,m.color,6,7,'fire',{life:160});
                    break;
                case 4: // GLACIER WISP
                    for(let i=0;i<5;i++) fireUniqueBullet(m.x,m.y,i*Math.PI*2/5+m.timer*.02,3.5,m.color,7,7,'frost',{life:250});
                    break;
                case 5: // SINGULARITY EYE
                    fireUniqueBullet(m.x,m.y,a,4.1,m.color,9,8,'gravity',{turn:.02,life:240});
                    break;
                case 6: // REDLINE SWEEPER
                    fireUniqueBullet(0,m.y,0,6.5,m.color,5,7,'sweep',{life:150});
                    break;
                case 7: // SKYFALL IMP
                    fireUniqueBullet(m.x,m.y,a,4.4,m.color,10,9,'meteor',{life:240});
                    break;
                case 8: // THORN BASTION
                    for(let i=-1;i<=1;i++) fireUniqueBullet(m.x,m.y,a+i*.28,5.5,m.color,7,8,'spikeTriangle',{life:190});
                    break;
                case 9: // RETURNING RAZOR
                    fireUniqueBullet(m.x,m.y,a,6,m.color,6,8,'boomer',{life:280});
                    break;
                case 10: // CLOSING MAW
                    fireUniqueBullet(0,m.y,0,5.4,m.color,6,8,'closer',{life:210});
                    fireUniqueBullet(900,m.y,Math.PI,5.4,m.color,6,8,'closer',{life:210});
                    break;
                case 11: // MINE MONGER
                    fireUniqueBullet(m.x,m.y,a,3.5,m.color,9,8,'mine',{life:260});
                    break;
                case 12: // SNARE WITCH
                    for(let i=-1;i<=1;i++) fireUniqueBullet(m.x,m.y,a+i*.25,5.2,m.color,6,7,'trap',{life:220});
                    break;
                case 13: // CLOCKBREAKER
                    for(let i=0;i<6;i++) fireUniqueBullet(m.x,m.y,i*Math.PI/3+m.timer*.02,4.3,m.color,6,8,'time',{life:240});
                    break;
            }
        }
        return;
    }

    /* 1 - SNIPER */

    if(m.kind==="sniper"){

        m.y+=(player.y-m.y)*.002;

        if(m.timer%105===0){

            fireBullet(
                m.x,
                m.y,
                getAngleToPlayer(m,15),
                8.5,
                m.color,
                5,
                0,
                7
            );
        }
    }


    /* 2 - PULSAR */

    else if(m.kind==="pulsar"){

        m.angle+=.035;

        m.x+=(450+Math.cos(m.angle)*300-m.x)*.012;
        m.y+=(180+Math.sin(m.angle)*120-m.y)*.012;

        if(m.timer%75===0){

            for(let i=0;i<4;i++){

                fireBullet(
                    m.x,
                    m.y,
                    m.angle+i*Math.PI/2,
                    4.5,
                    m.color,
                    4
                );
            }
        }
    }


    /* 3 - GHOST */

    else if(m.kind==="ghost"){

        m.x+=Math.cos(m.timer*.04)*1.2;
        m.y+=(player.y-m.y)*.001;

        if(m.timer%90===0){

            fireBullet(
                m.x,
                m.y,
                getAngleToPlayer(m),
                6,
                m.color,
                6,
                0,
                7
            );
        }
    }


    /* 4 - TWIN */

    else if(m.kind==="twin"){

        m.x+=(player.x-m.x)*.002;

        if(m.timer%75===0){

            const a=getAngleToPlayer(m);

            fireBullet(
                m.x,m.y,a-.22,
                6,m.color,5
            );

            fireBullet(
                m.x,m.y,a+.22,
                6,m.color,5
            );
        }
    }


    /* 5 - WALL */

    else if(m.kind==="wall"){

        m.x+=m.speed;

        if(m.x>canvas.width+30)
            m.x=-30;

        if(m.timer%95===0){

            fireBullet(
                m.x,
                0,
                Math.PI/2,
                4.5,
                m.color,
                7
            );
        }

        /* Mini walls: these are NOT enemies. They are compact walls made
           entirely from bullets, moving horizontally and vertically. */
        if(m.timer%150===0){

            const miniCount=8;
            const miniGap=canvas.height/(miniCount+1);

            /* Horizontal mini wall: a vertical line of bullets moving right. */
            for(let i=1;i<=miniCount;i++){
                fireBullet(
                    -8,
                    i*miniGap,
                    0,
                    3.2,
                    m.color,
                    5,
                    0,
                    3
                );
            }

            const miniGapX=canvas.width/(miniCount+1);

            /* Vertical mini wall: a horizontal line of bullets moving down. */
            for(let i=1;i<=miniCount;i++){
                fireBullet(
                    i*miniGapX,
                    -8,
                    Math.PI/2,
                    3.2,
                    m.color,
                    5,
                    0,
                    3
                );
            }
        }
    }



    /* 6 - BOUNCER */

    else if(m.kind==="bouncer"){

        m.x+=m.dx*m.speed;
        m.y+=m.dy*m.speed;

        if(m.x<20||m.x>880)
            m.dx*=-1;

        if(m.y<20||m.y>680)
            m.dy*=-1;

        if(m.timer%100===0){

            for(let i=0;i<4;i++){

                fireBullet(
                    m.x,
                    m.y,
                    getAngleToPlayer(m)+
                    (i-1.5)*.2,
                    5.5,
                    m.color,
                    5
                );
            }
        }
    }


    /* 7 - GRAVITY */

    else if(m.kind==="gravity"){

        const dx=m.x-player.x;
        const dy=m.y-player.y;
        const d=Math.hypot(dx,dy);

        if(d<250){

            player.x+=dx/400;
            player.y+=dy/400;
        }

        m.x+=(player.x-m.x)*.002;
        m.y+=(player.y-m.y)*.002;

        if(m.timer%85===0){

            fireBullet(
                m.x,m.y,
                getAngleToPlayer(m),
                5,
                m.color,
                6,
                0,
                6
            );
        }
    }


    /* 8 - CHRONO */

    else if(m.kind==="chrono"){

        m.y+=Math.sin(m.timer*.05)*.7;

        if(m.timer%100===0){

            m.x=Math.random()*760+70;
            m.y=Math.random()*300+50;

            for(let i=0;i<6;i++){

                fireBullet(
                    m.x,
                    m.y,
                    i*Math.PI/3,
                    4,
                    m.color,
                    4
                );
            }
        }
    }


    /* 9 - HYDRA */

    else if(m.kind==="hydra"){

        m.x+=(player.x-m.x)*.003;

        if(m.timer%80===0){

            aimSpread(
                m,
                3,
                .25,
                5.5,
                m.color,
                5,
                6
            );
        }
    }


    /* 10 - STRIKE */

    else if(m.kind==="strike"){

        m.x+=(player.x-m.x)*.002;

        if(m.timer%115===0){

            fireBullet(
                player.x,
                0,
                Math.PI/2,
                10,
                m.color,
                9,
                0,
                9
            );
        }
    }


    /* 11 - VOID */

    else if(m.kind==="void"){

        m.angle+=.025;

        m.x=450+Math.cos(m.angle)*260;
        m.y=230+Math.sin(m.angle)*130;

        if(m.timer%90===0){

            for(let i=0;i<6;i++){

                fireBullet(
                    m.x,
                    m.y,
                    i*Math.PI/3,
                    4,
                    m.color,
                    5
                );
            }
        }
    }


    /* 12 - GLITCH */

    else if(m.kind==="glitch"){

        if(m.timer%55===0){

            m.x=Math.random()*760+70;
            m.y=Math.random()*350+50;

            minionShoot(m);
        }
    }


    /* 13 - RAIN */

    else if(m.kind==="rain"){

        if(m.timer%25===0){

            fireBullet(
                m.x,
                m.y,
                Math.PI/2,
                5.5,
                m.color,
                4
            );
        }

        m.x+=Math.sin(m.timer*.03)*1.5;
    }


    /* 14 - STAR */

    else if(m.kind==="star"){

        m.angle+=.05;

        if(m.timer%50===0){

            for(let i=0;i<6;i++){

                fireBullet(
                    m.x,
                    m.y,
                    m.angle+i*Math.PI/3,
                    5,
                    m.color,
                    5
                );
            }
        }
    }


    /* 15 - OMEGA */

    else if(m.kind==="omega"){

        m.x+=(player.x-m.x)*.004;
        m.y+=(player.y-180-m.y)*.003;

        if(m.timer%55===0){

            for(let i=0;i<6;i++){

                fireBullet(
                    m.x,
                    m.y,
                    i*Math.PI/3+m.timer*.04,
                    5.5,
                    m.color,
                    5,
                    0,
                    6
                );
            }
        }

        if(m.timer%110===0){

            minionShoot(m);
        }
    }


    /* 16 - MINI MINELAYER */

    else if(m.kind==="minelayer"){

        m.x+=Math.sin(m.timer*.025)*1.5;

        if(m.timer%90===0){

            enemyBullets.push({

                x:m.x,
                y:m.y,

                dx:0,
                dy:0,

                speed:0,

                color:m.color,
                size:11,

                bounce:0,
                damage:9
            });
        }

        if(m.timer%100===0){

            minionShoot(m);
        }
    }


    /* 17 - SPLITTER */

    else if(m.kind==="splitter"){

        m.x+=(player.x-m.x)*.002;

        if(m.timer%75===0){

            aimSpread(
                m,
                3,
                .3,
                5,
                m.color,
                5,
                6
            );
        }
    }


    /* 18 - HUNTER */

    else if(m.kind==="hunter"){

        const dx=player.x-m.x;
        const dy=player.y-m.y;
        const d=Math.hypot(dx,dy)||1;

        m.x+=dx/d*m.speed*.45;
        m.y+=dy/d*m.speed*.45;

        if(m.timer%65===0){

            fireBullet(
                m.x,
                m.y,
                getAngleToPlayer(m,10),
                6,
                m.color,
                6,
                0,
                7
            );
        }
    }


    /* 19 - HELIX */

    else if(m.kind==="helix"){

        if(m.timer%10===0){

            fireBullet(
                m.x,
                m.y,
                m.timer*.15,
                5,
                m.color,
                4
            );
        }

        m.x+=(player.x-m.x)*.0015;
    }


    /* 20 - GRID */

    else if(m.kind==="grid"){

        /* ATTACK WARNING: the grid flashes before firing */
        if(m.timer%100===55)
            m.warningTimer=45;

        if(m.timer%100===0){

            fireBullet(
                m.x,
                0,
                Math.PI/2,
                5,
                m.color,
                6
            );

            fireBullet(
                0,
                m.y,
                0,
                5,
                m.color,
                6
            );

            m.warningTimer=0;
        }
    }


    /* 21 - TELEPORT */

    else if(m.kind==="teleport"){

        if(m.timer%85===0){

            m.x=Math.random()*760+70;
            m.y=Math.random()*300+50;

            aimSpread(
                m,
                3,
                .18,
                6.5,
                m.color,
                5,
                6
            );
        }
    }


    /* 22 - FIREWORK */

    else if(m.kind==="firework"){

        if(m.timer%90===0){

            for(let i=0;i<5;i++){

                fireBullet(
                    m.x,
                    m.y,
                    i*Math.PI*2/5,
                    3.2,
                    m.color,
                    7,
                    0,
                    5
                );
            }
        }

        if(m.timer%130===0){

            minionShoot(m);
        }
    }


    /* 23 - TIDAL */

    else if(m.kind==="tidal"){

        m.y+=Math.sin(m.timer*.035)*2;

        if(m.timer%100===0){

            fireBullet(
                0,
                m.y,
                0,
                5.5,
                m.color,
                7
            );

            fireBullet(
                900,
                m.y,
                Math.PI,
                5.5,
                m.color,
                7
            );
        }
    }


    /* 24 - MIRROR */

    else if(m.kind==="mirror"){

        m.x+=(player.x-m.x)*.003;
        m.y+=(player.y-m.y)*.001;

        if(m.timer%90===0){

            const a=getAngleToPlayer(m);

            fireBullet(
                m.x,m.y,
                a,
                6,
                m.color,
                6,
                0,
                7
            );

            fireBullet(
                m.x,m.y,
                a+Math.PI,
                4,
                m.color,
                5
            );
        }
    }


    /* 25 - ABSOLUTE */

    else if(m.kind==="absolute"){

        m.x+=Math.sin(m.timer*.025)*1.5;
        m.y+=Math.cos(m.timer*.03)*1.2;

        if(m.timer%55===0){

            for(let i=0;i<6;i++){

                fireBullet(
                    m.x,
                    m.y,
                    i*Math.PI/3+m.timer*.08,
                    5.5,
                    m.color,
                    6,
                    0,
                    7
                );
            }
        }

        if(m.timer%100===0){

            aimSpread(
                m,
                3,
                .16,
                7,
                m.color,
                6,
                8
            );
        }
    }


    /* KEEP MINIONS INSIDE A REASONABLE AREA */

    m.x=Math.max(-60,Math.min(canvas.width+60,m.x));
    m.y=Math.max(-60,Math.min(canvas.height+60,m.y));


    /* MINION CONTACT DAMAGE */

    if(
        m.contactCooldown<=0 &&
        Math.hypot(
            m.x-player.x,
            m.y-player.y
        )<
        m.size/2+player.size/2
    ){

        if(player.shield>0)
            player.shield--;
        else
            player.hp-=7;

        m.contactCooldown=45;

        updateUI();

        if(player.hp<=0)
            playerDefeated();
    }
}


/* =========================================================
   MINION DEATH
========================================================= */

function killMinion(index){

    const m=minions[index];

    if(
        m.kind==="splitter" &&
        !m.splitDone
    ){

        for(let i=0;i<2;i++){

            minions.push({

                name:"SPLITTER FRAGMENT",
                kind:"splitFragment",
                color:m.color,
                size:11,
                hp:12,
                maxHp:12,
                speed:2.8,

                x:m.x+(i===0?-12:12),
                y:m.y,

                timer:0,
                contactCooldown:0,
                splitDone:true,

                angle:Math.random()*Math.PI*2
            });
        }
    }

    minions.splice(index,1);
}


/* =========================================================
   SPLITTER FRAGMENTS
========================================================= */

function updateSplitFragment(m){

    const dx=player.x-m.x;
    const dy=player.y-m.y;
    const d=Math.hypot(dx,dy)||1;

    m.x+=dx/d*1.9;
    m.y+=dy/d*1.9;

    m.timer++;

    if(m.timer%70===0){

        fireBullet(
            m.x,
            m.y,
            getAngleToPlayer(m),
            5,
            m.color,
            4,
            0,
            4
        );
    }

    if(m.contactCooldown>0)
        m.contactCooldown--;

    if(
        m.contactCooldown<=0 &&
        Math.hypot(m.x-player.x,m.y-player.y)
        <
        m.size/2+player.size/2
    ){

        if(player.shield>0)
            player.shield--;
        else
            player.hp-=5;

        m.contactCooldown=45;

        updateUI();

        if(player.hp<=0)
            playerDefeated();
    }
}

/* =========================================================
   SHOOTING
========================================================= */

function shoot(){

    if(
        !gameActive||
        waitingForPowerup||
        player.fireCooldown>0
    )
        return;

    const rect=
        canvas.getBoundingClientRect();

    const scaleX=canvas.width/rect.width;
    const scaleY=canvas.height/rect.height;

    const mouseX=
        (lastMouseX-rect.left)*scaleX;

    const mouseY=
        (lastMouseY-rect.top)*scaleY;

    const baseAngle = mobileEnabled && mobileFireDown
        ? mobileAimAngle
        : Math.atan2(
            mouseY-player.y,
            mouseX-player.x
        );

    const total=player.shots;

    for(let i=0;i<total;i++){

        let angle=baseAngle;

        if(total>1){

            angle=
                baseAngle+
                (i-(total-1)/2)*
                player.shotSpread;
        }

        bullets.push({

            x:player.x,
            y:player.y,

            speed:12,

            dx:Math.cos(angle),
            dy:Math.sin(angle),

            damage:player.damage,
            pierce:player.piercing
        });
    }

    player.fireCooldown=
        player.fireRate;
}


function performDash(){
    if(
        player.dashPower<=0 ||
        player.dashCooldown>0 ||
        !gameActive ||
        waitingForPowerup
    ) return;

    let dx=0;
    let dy=0;

    if(mobileEnabled && (mobileMoveX!==0 || mobileMoveY!==0)){
        dx=mobileMoveX;
        dy=mobileMoveY;
    }else{
        if(keys["w"]||keys["arrowup"])dy--;
        if(keys["s"]||keys["arrowdown"])dy++;
        if(keys["a"]||keys["arrowleft"])dx--;
        if(keys["d"]||keys["arrowright"])dx++;
    }

    if(dx===0&&dy===0) dy=-1;

    const length=Math.hypot(dx,dy)||1;
    player.x+=dx/length*100;
    player.y+=dy/length*100;

    player.x=Math.max(player.size,Math.min(canvas.width-player.size,player.x));
    player.y=Math.max(player.size,Math.min(canvas.height-player.size,player.y));

    player.dashCooldown=player.dashPower===2?45:70;
}

/* =========================================================
   BOSS INITIALIZATION
========================================================= */

function initBoss(){

    if(currentBossIndex>=bosses.length){

        gameActive=false;

        alert(
            "GOD SLAYER!\n\n"+
            "You cleared all 40 bosses!"
        );

        return;
    }

    bullets=[];
    enemyBullets=[];
    minions=[];
    bossHazards=[];

    const template=
        bosses[currentBossIndex];

    boss={
        ...template,
        x:450,
        y:150,
        timer:0,
        maxHp:template.hp
    };

    uiBoss.textContent=
        currentBossIndex+1;

    uiName.textContent=
        boss.name;

    startBossMusic(currentBossIndex);
    updateUI();
}


/* =========================================================
   UI
========================================================= */

function updateUI(){

    uiHp.textContent=
        Math.max(
            0,
            Math.ceil(player.hp)
        );

    let displayedBossHP=0;

    if(sandboxMode){
        displayedBossHP=sandboxBosses.reduce((sum,b)=>sum+Math.max(0,b.hp),0);
    }else{
        displayedBossHP=boss?boss.hp:0;
    }

    uiBhp.textContent=Math.max(0,Math.ceil(displayedBossHP));

    uiPower.textContent=
        player.damage;
}


/* =========================================================
   UPDATE
========================================================= */

function update(){

    if(
        !gameActive||
        waitingForPowerup
    )
        return;

    player.vx=0;
    player.vy=0;

    if(mobileEnabled){
        player.x+=mobileMoveX*player.speed;
        player.y+=mobileMoveY*player.speed;
        player.vx=mobileMoveX*player.speed;
        player.vy=mobileMoveY*player.speed;
    }

    if(keys["w"]||keys["arrowup"]){

        player.y-=player.speed;
        player.vy=-player.speed;
    }

    if(keys["s"]||keys["arrowdown"]){

        player.y+=player.speed;
        player.vy=player.speed;
    }

    if(keys["a"]||keys["arrowleft"]){

        player.x-=player.speed;
        player.vx=-player.speed;
    }

    if(keys["d"]||keys["arrowright"]){

        player.x+=player.speed;
        player.vx=player.speed;
    }

    player.x=
        Math.max(
            player.size,
            Math.min(
                canvas.width-player.size,
                player.x
            )
        );

    player.y=
        Math.max(
            player.size,
            Math.min(
                canvas.height-player.size,
                player.y
            )
        );

    if(player.fireCooldown>0)
        player.fireCooldown--;

    if(player.dashCooldown>0)
        player.dashCooldown--;

    if(mouseDown||mobileFireDown)
        shoot();


    /* =====================================================
       PLAYER BULLETS
    ===================================================== */

    for(let i=bullets.length-1;i>=0;i--){

        const b=bullets[i];

        b.x+=b.dx*b.speed;
        b.y+=b.dy*b.speed;

        if(
            b.x<-30||
            b.x>canvas.width+30||
            b.y<-30||
            b.y>canvas.height+30
        ){

            bullets.splice(i,1);
        }
    }


    /* =====================================================
       BOSSES
    ===================================================== */

    if(sandboxMode){

        /* Sandbox allows unlimited bosses at once. */
        for(let si=sandboxBosses.length-1;si>=0;si--){

            const sb=sandboxBosses[si];

            sb.timer++;
            sb.update();
            bossChase(sb);

            /* Player bullets can hit any summoned boss. */
            for(let bi=bullets.length-1;bi>=0;bi--){

                const b=bullets[bi];

                if(
                    Math.hypot(b.x-sb.x,b.y-sb.y)<
                    sb.size/2
                ){

                    sb.hp-=b.damage;

                    if(b.pierce>0){
                        b.pierce--;
                    }else{
                        bullets.splice(bi,1);
                    }

                    if(sb.hp<=0){
                        sandboxBosses.splice(si,1);
                        break;
                    }
                }
            }
        }

        boss=sandboxBosses.length
            ?sandboxBosses[sandboxBosses.length-1]
            :null;

        updateUI();

    }else if(boss){

        boss.timer++;
        boss.update();
        bossChase(boss);

        /* RANDOM MINION SPAWNING */

        const spawnInterval=currentBossIndex<15?240:220;
        const maxMinions=currentBossIndex<15?3:2;
        const unlimitedMinions=currentBossIndex===0;

        if(
            boss.timer>100 &&
            boss.timer%spawnInterval===0 &&
            (unlimitedMinions || minions.length<maxMinions)
        ){
            spawnMinion(currentBossIndex);
        }

        /* BOSS COLLISION */

        for(let bi=bullets.length-1;bi>=0;bi--){

            const b=bullets[bi];

            if(
                Math.hypot(b.x-boss.x,b.y-boss.y)<
                boss.size/2
            ){

                boss.hp-=b.damage;

                if(b.pierce>0){
                    b.pierce--;
                }else{
                    bullets.splice(bi,1);
                }

                updateUI();

                if(boss.hp<=0){

                    bullets=[];
                    enemyBullets=[];
                    minions=[];
                    bossHazards=[];

                    currentBossIndex++;

                    if(currentBossIndex>=bosses.length){
                        gameActive=false;
                        alert(
                            "GOD SLAYER!\n\n"+
                            "You cleared all 40 bosses!"
                        );
                        return;
                    }

                    choosePowerups();
                    return;
                }
            }
        }
    }


    /* =====================================================
       NEW BOSS ARENA HAZARDS
    ===================================================== */

    updateBossHazards();

    /* =====================================================
       MINIONS
    ===================================================== */

    for(let mi=minions.length-1;mi>=0;mi--){

        const m=minions[mi];

        if(m.kind==="splitFragment")
            updateSplitFragment(m);
        else
            updateMinion(m);

        /* Every enemy is physically kept inside the arena square. */
        const edge=Math.max(10,m.size/2);
        m.x=Math.max(edge,Math.min(canvas.width-edge,m.x));
        m.y=Math.max(edge,Math.min(canvas.height-edge,m.y));

        /* PLAYER BULLET VS MINION */

        for(let bi=bullets.length-1;bi>=0;bi--){

            const b=bullets[bi];

            if(
                Math.hypot(
                    b.x-m.x,
                    b.y-m.y
                )<
                m.size/2+3
            ){

                m.hp-=b.damage;

                if(b.pierce>0){

                    b.pierce--;

                }else{

                    bullets.splice(bi,1);
                }

                if(m.hp<=0){

                    killMinion(mi);
                    break;
                }
            }
        }
    }


    /* =====================================================
       ENEMY BULLETS
    ===================================================== */

    for(let i=enemyBullets.length-1;i>=0;i--){

        const b=enemyBullets[i];
        b.age=(b.age||0)+1;

        /* UNIQUE BOSS PROJECTILES */
        if(b.kind){
            if(b.kind==='bossOrbit'){
                const ob=b.orbitBoss;
                if(ob){
                    const oa=(b.orbitAngle||0)+b.age*(b.orbitSpeed||.055);
                    const r=b.orbitRadius||80;
                    b.x=ob.x+Math.cos(oa)*r;
                    b.y=ob.y+Math.sin(oa)*r;
                    b.dx=-Math.sin(oa); b.dy=Math.cos(oa);
                }
            }else if(b.kind==='spiral'||b.kind==='apocalypse-spiral'){
                const turn=b.turn||.035;
                const c=Math.cos(turn),s=Math.sin(turn),dx=b.dx,dy=b.dy;
                b.dx=dx*c-dy*s; b.dy=dx*s+dy*c;
            }else if(b.kind==='homing'||b.kind==='apocalypse-homing'){
                const a=Math.atan2(player.y-b.y,player.x-b.x);
                const cur=Math.atan2(b.dy,b.dx);
                let d=a-cur; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2;
                const na=cur+Math.max(-.045,Math.min(.045,d)); b.dx=Math.cos(na); b.dy=Math.sin(na);
            }else if(b.kind==='heavy'||b.kind==='apocalypse-heavy'){
                b.speed=Math.min(8,b.speed+0.012);
            }else if(b.kind==='boomer'||b.kind==='apocalypse-boomer'){
                if(b.age===48){b.dx*=-1;b.dy*=-1;}
            }else if(b.kind==='mine'||b.kind==='apocalypse-mine'){
                if(b.age===42) b.speed=0;
                if(b.speed===0 && b.age===105){
                    for(let q=0;q<8;q++) fireUniqueBullet(b.x,b.y,q*Math.PI/4,4.8,b.color,5,b.damage*.7,'burst');
                    b.life=b.age;
                }
            }else if(b.kind==='ricochet'||b.kind==='apocalypse-ricochet'){
                /* bounce handled below */
            }else if(b.kind==='sine'||b.kind==='apocalypse-sine'){
                const a=Math.atan2(b.dy,b.dx), side=Math.sin(b.age*.16+b.phase)*.08;
                const na=a+side;b.dx=Math.cos(na);b.dy=Math.sin(na);
            }else if(b.kind==='teleport'||b.kind==='apocalypse-teleport'){
                if(b.age%50===0){b.x+=b.dx*70;b.y+=b.dy*70;}
            }else if(b.kind==='wave'||b.kind==='apocalypse-wave'){
                const a=Math.atan2(b.dy,b.dx),na=a+Math.sin(b.age*.13+b.phase)*.06;b.dx=Math.cos(na);b.dy=Math.sin(na);
            }else if(b.kind==='grow'||b.kind==='apocalypse-grow'){
                b.size=Math.min(24,b.size+.035);
            }else if(b.kind==='orbit'||b.kind==='apocalypse-orbit'){
                const a=Math.atan2(b.dy,b.dx)+.055;b.dx=Math.cos(a);b.dy=Math.sin(a);
            }else if(b.kind==='burst'||b.kind==='apocalypse-burst'){
                if(b.age===38){
                    for(let q=0;q<6;q++) fireUniqueBullet(b.x,b.y,q*Math.PI/3,5,b.color,4,b.damage*.65,'zigzag');
                }
            }else if(b.kind==='zigzag'||b.kind==='apocalypse-zigzag'){
                const a=Math.atan2(b.dy,b.dx),na=a+Math.sin(b.age*.22+b.phase)*.12;b.dx=Math.cos(na);b.dy=Math.sin(na);
            }else if(b.kind==='reverse'||b.kind==='apocalypse-reverse'){
                if(b.age%70===0){b.dx*=-1;b.dy*=-1;}
            }
            if(b.age>b.life){ enemyBullets.splice(i,1); continue; }
        }

        /* STATIONARY MINES / NEON GHOST BOMBS */

        if(b.kind && b.kind.includes('mine') && b.speed===0 && b.age>=b.life){
            enemyBullets.splice(i,1);
            continue;
        }

        if(b.speed===0){
            if(b.bomb){
                b.timer++;
                const d=Math.hypot(b.x-player.x,b.y-player.y);

                if(d<player.size/2+b.size){
                    if(player.shield>0) player.shield--;
                    else player.hp-=b.damage;
                    enemyBullets.splice(i,1);
                    updateUI();
                    if(player.hp<=0) playerDefeated();
                    continue;
                }

                if(b.timer>=b.fuse){
                    if(d<=b.blastRadius){
                        if(player.shield>0) player.shield--;
                        else player.hp-=b.damage;
                        updateUI();
                        if(player.hp<=0) playerDefeated();
                    }
                    enemyBullets.splice(i,1);
                }
                continue;
            }

            if(Math.hypot(b.x-player.x,b.y-player.y)<player.size/2+b.size){
                if(player.shield>0) player.shield--;
                else player.hp-=b.damage;
                enemyBullets.splice(i,1);
                updateUI();
                if(player.hp<=0) playerDefeated();
            }
            continue;
        }

        if(b.kind!=='bossOrbit'){
            b.x+=b.dx*b.speed;
            b.y+=b.dy*b.speed;
        }


        /* BOUNCING */

        if(b.bounce>0){

            if(
                b.x<0||
                b.x>canvas.width
            ){

                b.dx*=-1;
                b.bounce--;
            }

            if(
                b.y<0||
                b.y>canvas.height
            ){

                b.dy*=-1;
                b.bounce--;
            }
        }


        /* PLAYER HIT */

        if(
            Math.hypot(
                b.x-player.x,
                b.y-player.y
            )<
            player.size/2+b.size/2
        ){

            if(player.shield>0){

                player.shield--;

            }else{

                player.hp-=b.damage||5;
            }

            enemyBullets.splice(i,1);

            updateUI();

            if(player.hp<=0){

                playerDefeated();
                return;
            }

            continue;
        }


        /* REMOVE OFFSCREEN */

        if(
            b.x<-100||
            b.x>canvas.width+100||
            b.y<-100||
            b.y>canvas.height+100
        ){

            enemyBullets.splice(i,1);
        }
    }
}


/* =========================================================
   DRAW
========================================================= */

function draw(){

    ctx.fillStyle=
        "rgba(0,0,0,.3)";

    ctx.fillRect(
        0,0,
        canvas.width,
        canvas.height
    );


    /* PLAYER */

    ctx.fillStyle="#0f0";

    ctx.shadowBlur=15;
    ctx.shadowColor="#0f0";

    ctx.fillRect(
        player.x-player.size/2,
        player.y-player.size/2,
        player.size,
        player.size
    );


    /* SHIELD */

    if(player.shield>0){

        ctx.strokeStyle="#00ffff";
        ctx.lineWidth=3;

        ctx.beginPath();

        ctx.arc(
            player.x,
            player.y,
            27,
            0,
            Math.PI*2
        );

        ctx.stroke();

        ctx.fillStyle="#00ffff";
        ctx.font="12px Courier New";

        ctx.fillText(
            "S:"+player.shield,
            player.x+18,
            player.y-20
        );
    }


    /* BOSSES */

    const bossesToDraw=sandboxMode?sandboxBosses:(boss?[boss]:[]);

    for(const db of bossesToDraw){

        ctx.fillStyle=db.color;
        ctx.shadowColor=db.color;
        ctx.shadowBlur=15;

        ctx.fillRect(
            db.x-db.size/2,
            db.y-db.size/2,
            db.size,
            db.size
        );

        ctx.shadowBlur=0;

        /* BOSS HP */
        ctx.fillStyle="#222";
        ctx.fillRect(
            db.x-50,
            db.y-db.size-14,
            100,
            7
        );

        ctx.fillStyle=db.color;
        ctx.fillRect(
            db.x-50,
            db.y-db.size-14,
            Math.max(0,db.hp/db.maxHp*100),
            7
        );
    }


    /* =====================================================
       MINIONS
    ===================================================== */

    minions.forEach(m=>{

        /* GRID DRONE ATTACK WARNING */
        if(m.kind==="grid" && m.warningTimer>0){

            const pulse=0.22+0.28*Math.sin(m.warningTimer*.45)**2;

            ctx.save();
            ctx.globalAlpha=pulse;
            ctx.strokeStyle=m.color;
            ctx.shadowColor=m.color;
            ctx.shadowBlur=14;
            ctx.lineWidth=4;

            ctx.beginPath();
            ctx.moveTo(m.x,0);
            ctx.lineTo(m.x,canvas.height);
            ctx.moveTo(0,m.y);
            ctx.lineTo(canvas.width,m.y);
            ctx.stroke();

            ctx.globalAlpha=0.9;
            ctx.lineWidth=2;
            ctx.stroke();
            ctx.restore();
        }

        ctx.fillStyle=m.color;
        ctx.shadowColor=m.color;
        ctx.shadowBlur=10;

        if(m.kind==="star"){

            ctx.beginPath();

            for(let i=0;i<10;i++){

                const a=
                    m.timer*.04+
                    i*Math.PI/5;

                const r=
                    i%2===0
                    ?m.size
                    :m.size*.45;

                const x=m.x+Math.cos(a)*r;
                const y=m.y+Math.sin(a)*r;

                if(i===0)
                    ctx.moveTo(x,y);
                else
                    ctx.lineTo(x,y);
            }

            ctx.closePath();
            ctx.fill();

        }else if(m.kind==="ghost"){

            ctx.beginPath();

            ctx.arc(
                m.x,
                m.y,
                m.size/2,
                Math.PI,
                0
            );

            ctx.lineTo(
                m.x+m.size/2,
                m.y+m.size/2
            );

            ctx.lineTo(
                m.x,
                m.y+m.size/3
            );

            ctx.lineTo(
                m.x-m.size/2,
                m.y+m.size/2
            );

            ctx.closePath();
            ctx.fill();

        }else if(m.kind==="splitFragment"){

            ctx.beginPath();

            ctx.arc(
                m.x,
                m.y,
                m.size/2,
                0,
                Math.PI*2
            );

            ctx.fill();

        }else{

            ctx.fillRect(
                m.x-m.size/2,
                m.y-m.size/2,
                m.size,
                m.size
            );
        }

        ctx.shadowBlur=0;


        /* MINION HP BAR */

        if(m.hp<m.maxHp){

            ctx.fillStyle="#222";

            ctx.fillRect(
                m.x-m.size/2,
                m.y-m.size/2-7,
                m.size,
                3
            );

            ctx.fillStyle=m.color;

            ctx.fillRect(
                m.x-m.size/2,
                m.y-m.size/2-7,
                Math.max(
                    0,
                    m.hp/m.maxHp*m.size
                ),
                3
            );
        }
    });


    /* =====================================================
       PLAYER PROJECTILES
    ===================================================== */

    bullets.forEach(b=>{

        ctx.fillStyle="#fff";
        ctx.shadowColor="#fff";
        ctx.shadowBlur=5;

        ctx.fillRect(
            b.x-2,
            b.y-2,
            5,
            5
        );
    });


    drawBossHazards();

    /* =====================================================
       ENEMY PROJECTILES
    ===================================================== */

    enemyBullets.forEach(b=>{

        ctx.fillStyle=b.color;
        ctx.shadowColor=b.color;
        ctx.shadowBlur=8;

        if(b.bomb){
            const remaining=Math.max(0,b.fuse-b.timer);
            const pulse=1+Math.sin(b.timer*.25)*.2;

            ctx.beginPath();
            ctx.arc(b.x,b.y,b.size*pulse,0,Math.PI*2);
            ctx.fill();

            ctx.strokeStyle=b.color;
            ctx.lineWidth=2;
            ctx.beginPath();
            ctx.arc(b.x,b.y,b.blastRadius*(1-remaining/b.fuse),0,Math.PI*2);
            ctx.stroke();

            ctx.fillStyle="#fff";
            ctx.font="10px Courier New";
            ctx.fillText(Math.ceil(remaining/60),b.x-3,b.y+4);
        }else{
            if(b.kind && b.kind.includes('flame')){
                ctx.save();
                const ta=Math.atan2(b.dy,b.dx);
                ctx.translate(b.x,b.y);
                ctx.rotate(ta);
                for(let k=1;k<=6;k++){
                    const fade=1-k/7;
                    ctx.globalAlpha=fade*.65;
                    ctx.fillStyle=(k%2===0)?'#ffcc33':'#ff3300';
                    ctx.beginPath();
                    ctx.arc(-k*b.size*.75+(Math.random()-.5)*3,0,k===1?b.size*.6:b.size*(.35+Math.random()*.2),0,Math.PI*2);
                    ctx.fill();
                }
                ctx.globalAlpha=1;
                ctx.restore();
            }
            ctx.save();
            ctx.translate(b.x,b.y);
            const a=Math.atan2(b.dy,b.dx);
            ctx.rotate(a);
            if(b.kind && b.kind.includes('bossOrbit')){
                ctx.beginPath();ctx.arc(0,0,b.size,0,Math.PI*2);ctx.fill();
                ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
            }else if(b.kind && b.kind.includes('spikeTriangle')){
                ctx.beginPath();
                ctx.moveTo(b.size*1.55,0);
                ctx.lineTo(-b.size*.9,-b.size*.95);
                ctx.lineTo(-b.size*.9,b.size*.95);
                ctx.closePath();
                ctx.fill();
            }else if(b.kind && b.kind.includes('heavy')){
                ctx.fillRect(-b.size*1.7,-b.size/2,b.size*3.4,b.size);
            }else if(b.kind && b.kind.includes('zigzag')){
                ctx.beginPath();ctx.moveTo(-b.size*1.4,0);ctx.lineTo(0,-b.size);ctx.lineTo(b.size*1.4,0);ctx.lineTo(0,b.size);ctx.closePath();ctx.fill();
            }else if(b.kind && b.kind.includes('mine')){
                ctx.beginPath();ctx.arc(0,0,b.size,0,Math.PI*2);ctx.fill();
                ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
            }else if(b.kind && b.kind.includes('burst')){
                ctx.fillRect(-b.size*1.2,-b.size*.45,b.size*2.4,b.size*.9);
                ctx.fillRect(-b.size*.45,-b.size*1.2,b.size*.9,b.size*2.4);
            }else if(b.kind && b.kind.includes('teleport')){
                ctx.strokeStyle=b.color;ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,b.size,0,Math.PI*2);ctx.stroke();
                ctx.fillRect(-b.size*.35,-b.size*.35,b.size*.7,b.size*.7);
            }else if(b.kind && b.kind.includes('grow')){
                ctx.beginPath();ctx.arc(0,0,b.size,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.stroke();
            }else{
                ctx.beginPath();ctx.arc(0,0,b.size,0,Math.PI*2);ctx.fill();
            }
            ctx.restore();
        }
    });

    ctx.shadowBlur=0;
}


/* =========================================================
   MAIN MENU + SANDBOX
========================================================= */

const mainMenu=document.getElementById("mainMenu");
const sandboxMenu=document.getElementById("sandboxMenu");
const startGameButton=document.getElementById("startGameButton");
const startSandboxButton=document.getElementById("startSandboxButton");
const sandboxBossSelect=document.getElementById("sandboxBossSelect");
const sandboxEnemySelect=document.getElementById("sandboxEnemySelect");
const spawnBossButton=document.getElementById("spawnBossButton");
const spawnEnemyButton=document.getElementById("spawnEnemyButton");
const clearSandboxButton=document.getElementById("clearSandboxButton");
const exitSandboxButton=document.getElementById("exitSandboxButton");
const mobileToggle=document.getElementById("mobileToggle");
const mobileControls=document.getElementById("mobileControls");
const mobileJoystick=document.getElementById("mobileJoystick");
const mobileStick=document.getElementById("mobileStick");
const mobileAim=document.getElementById("mobileAim");
const mobileAimStick=document.getElementById("mobileAimStick");
const mobileDashButton=document.getElementById("mobileDashButton");
let mobileEnabled=false;
let mobileMoveX=0;
let mobileMoveY=0;
let mobileFireDown=false;

// Always begin in the main menu when the HTML file is opened.
function showMainMenuOnStartup(){
    document.body.classList.add("menuOpen");
    mainMenu.style.display="flex";
    sandboxMenu.style.display="none";
    powerupScreen.style.display="none";
    gameActive=false;
    waitingForPowerup=false;
    sandboxMode=false;
    boss=null;
    bullets=[];
    enemyBullets=[];
    minions=[];
    bossHazards=[];
}

mainMenu.addEventListener("pointerdown",()=>{
    if(document.body.classList.contains("menuOpen")) startMenuMusic();
},{passive:true});

function fillSandboxMenus(){

    sandboxBossSelect.innerHTML="";
    bosses.forEach((b,i)=>{
        const option=document.createElement("option");
        option.value=i;
        option.textContent=(i+1)+" - "+b.name;
        sandboxBossSelect.appendChild(option);
    });

    sandboxEnemySelect.innerHTML="";
    minionTypes.forEach((m,i)=>{
        const option=document.createElement("option");
        option.value=i;
        option.textContent=(i+1)+" - "+m.name;
        sandboxEnemySelect.appendChild(option);
    });
}

function resetPlayer(){
    player={
        x:450, y:600, size:18, hp:100, maxHp:100, speed:6,
        damage:5, fireRate:10, fireCooldown:0,
        shots:1, shotSpread:.13, piercing:0, shield:0,
        dashPower:0, dashCooldown:0
    };
}


function setMobileEnabled(enabled){
    mobileEnabled=enabled;
    mobileControls.classList.toggle("enabled",enabled);
    mobileToggle.textContent=enabled?"DISABLE MOBILE":"ENABLE MOBILE";
    mobileToggle.style.borderColor=enabled?"#0f0":"#555";
    if(!enabled){
        mobileMoveX=0;
        mobileMoveY=0;
        mobileFireDown=false;
        mobileStick.style.transform="translate(0px,0px)";
        mobileAimStick.style.transform="translate(0px,0px)";
    }
}

function joystickMove(e){
    const r=mobileJoystick.getBoundingClientRect();
    const cx=r.left+r.width/2;
    const cy=r.top+r.height/2;
    let dx=e.clientX-cx;
    let dy=e.clientY-cy;
    const max=44;
    const len=Math.hypot(dx,dy)||1;
    if(len>max){dx=dx/len*max;dy=dy/len*max;}
    mobileMoveX=dx/max;
    mobileMoveY=dy/max;
    mobileStick.style.transform=`translate(${dx}px,${dy}px)`;
}

mobileToggle.onclick=()=>setMobileEnabled(!mobileEnabled);
mobileDashButton.addEventListener("pointerdown",e=>{
    if(!mobileEnabled)return;
    performDash();
    e.preventDefault();
});

mobileJoystick.addEventListener("pointerdown",e=>{
    if(!mobileEnabled)return;
    mobileJoystick.setPointerCapture(e.pointerId);
    joystickMove(e);
    e.preventDefault();
});
mobileJoystick.addEventListener("pointermove",e=>{
    if(!mobileEnabled)return;
    joystickMove(e);
    e.preventDefault();
});
mobileJoystick.addEventListener("pointerup",e=>{
    mobileMoveX=0; mobileMoveY=0; mobileStick.style.transform="translate(0px,0px)";
    e.preventDefault();
});
mobileJoystick.addEventListener("pointercancel",()=>{
    mobileMoveX=0; mobileMoveY=0; mobileStick.style.transform="translate(0px,0px)";
});

function setMobileAim(e){
    const r=mobileAim.getBoundingClientRect();
    const cx=r.left+r.width/2;
    const cy=r.top+r.height/2;
    const dx=e.clientX-cx;
    const dy=e.clientY-cy;
    const len=Math.hypot(dx,dy);
    const max=58;

    /* Use the joystick's angle directly for shooting. This avoids converting
       the touch position through the canvas's CSS scaling, which can make the
       bullet direction feel offset on phones/tablets. */
    if(len>5){
        mobileAimAngle=Math.atan2(dy,dx);
    }

    const useLen=Math.min(len,max);
    const nx=Math.cos(mobileAimAngle);
    const ny=Math.sin(mobileAimAngle);
    mobileAimStick.style.transform=`translate(${nx*useLen}px,${ny*useLen}px)`;

    /* Keep the virtual mouse target updated too for compatibility with the
       rest of the game's aiming code. */
    lastMouseX=player.x+nx*300;
    lastMouseY=player.y+ny*300;
}
mobileAim.addEventListener("pointerdown",e=>{
    if(!mobileEnabled)return;
    mobileAim.setPointerCapture(e.pointerId);
    mobileFireDown=true;
    setMobileAim(e);
    e.preventDefault();
});
mobileAim.addEventListener("pointermove",e=>{
    if(!mobileEnabled)return;
    setMobileAim(e);
    e.preventDefault();
});
mobileAim.addEventListener("pointerup",e=>{
    mobileFireDown=false;
    mobileAimStick.style.transform="translate(0px,0px)";
    e.preventDefault();
});
mobileAim.addEventListener("pointercancel",()=>{
    mobileFireDown=false;
    mobileAimStick.style.transform="translate(0px,0px)";
});

function unlockAndPlayMusic(){
    if(!ensureAudio()) return;
    const begin=()=>{
        try{
            const now=audioCtx.currentTime;
            const o=audioCtx.createOscillator();
            const g=audioCtx.createGain();
            o.type="square";
            o.frequency.setValueAtTime(440,now);
            g.gain.setValueAtTime(.0001,now);
            g.gain.linearRampToValueAtTime(.035,now+.005);
            g.gain.exponentialRampToValueAtTime(.0001,now+.055);
            o.connect(g);g.connect(audioCtx.destination);
            o.start(now);o.stop(now+.06);
        }catch(e){}
        startMusic(desiredMusicTheme||longMenuMusic,desiredMusicKey||"menu");
    };
    if(audioCtx.state==="running") begin();
    else audioCtx.resume().then(begin).catch(()=>{});
}

function startGame(){
    unlockAndPlayMusic();
    setMobileEnabled(false);
    document.body.classList.remove("menuOpen");
    sandboxMode=false;
    mainMenu.style.display="none";
    sandboxMenu.style.display="none";
    powerupScreen.style.display="none";
    waitingForPowerup=false;
    currentBossIndex=0;
    resetPlayer();
    bullets=[];
    enemyBullets=[];
    minions=[];
    gameActive=true;
    initBoss();
    updateUI();
}

function startSandbox(){
    unlockAndPlayMusic();
    setMobileEnabled(false);
    document.body.classList.remove("menuOpen");
    sandboxMode=true;
    mainMenu.style.display="none";
    sandboxMenu.style.display="block";
    powerupScreen.style.display="none";
    waitingForPowerup=false;
    boss=null;
    sandboxBosses=[];
    bullets=[];
    enemyBullets=[];
    minions=[];
    currentBossIndex=0;
    resetPlayer();
    gameActive=true;
    startSandboxMusic();
    updateUI();
}

function spawnSandboxBoss(){
    const index=Number(sandboxBossSelect.value);
    const template=bosses[index];

    /* Each click adds another independent boss. */
    currentBossIndex=index;

    const count=sandboxBosses.length;
    const angle=count*0.9;
    const radius=Math.min(230,60+count*18);

    const newBoss={
        ...template,
        x:450+Math.cos(angle)*radius,
        y:180+Math.sin(angle)*radius,
        timer:0,
        maxHp:template.hp
    };

    newBoss.x=Math.max(newBoss.size,Math.min(canvas.width-newBoss.size,newBoss.x));
    newBoss.y=Math.max(newBoss.size+20,Math.min(canvas.height/2,newBoss.y));

    sandboxBosses.push(newBoss);
    boss=newBoss;
    updateUI();
}

function spawnSandboxEnemy(){
    const index=Number(sandboxEnemySelect.value);
    spawnMinion(index);
}

function clearSandbox(){
    boss=null;
    sandboxBosses=[];
    bullets=[];
    enemyBullets=[];
    minions=[];
    updateUI();
}

function exitToMainMenu(){
    setMobileEnabled(false);
    stopMusic();
    document.body.classList.add("menuOpen");
    sandboxMode=false;
    gameActive=false;
    waitingForPowerup=false;
    boss=null;
    sandboxBosses=[];
    bullets=[];
    enemyBullets=[];
    minions=[];
    sandboxMenu.style.display="none";
    powerupScreen.style.display="none";
    mainMenu.style.display="flex";
    updateUI();
}

startGameButton.onclick=startGame;
startSandboxButton.onclick=startSandbox;
spawnBossButton.onclick=spawnSandboxBoss;
spawnEnemyButton.onclick=spawnSandboxEnemy;
clearSandboxButton.onclick=clearSandbox;
exitSandboxButton.onclick=exitToMainMenu;

fillSandboxMenus();
showMainMenuOnStartup();


/* =========================================================
   LOOP
========================================================= */

function gameLoop(){

    update();
    draw();

    requestAnimationFrame(gameLoop);
}

gameLoop();

</script>
