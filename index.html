<style>
html, body{

button, canvas, input, select, textarea{

    -webkit-user-select:none;

.stat{

.label{

#msg{

.powerChoice span{
    color:#aaa;

    ];
    const motif=motifs[index%motifs.length];
    const song=[];
    const mode=index%8;
    for(let section=0;section<64;section++){
        const reverse=(mode===1&&section%8>=4)||(mode===5&&section%4===3);
        const rotate=(section*(1+(index%5)))%motif.length;
        for(let i=0;i<motif.length;i++){
            const pos=reverse?(motif.length-1-i):i;
            let n=motif[(pos+rotate)%motif.length];
            // Four different musical sections: statement, answer, lift, finale.
            if(section%4===1)n += (i%8===0 ? (index%3)-1 : 0);
            if(section%4===2)n += (i%4===0 ? 2+(index%2) : (i%8===4 ? 1 : 0));
            if(section%4===3)n += (i%8===0 ? 3 : (i%8===7 ? -1 : 0));
            if(mode===2 && section%6===0)n += (i%3===0?2:-1);
            if(mode===3 && section%5===2)n = Math.max(0,n-2);
            if(mode===4 && section>=32)n += 2;
            if(mode===6 && section%8===6)n = Math.max(0,12-n%13);
            if(mode===7 && section%3===0)n += (i%2?1:0);
            song.push(Math.max(0,n));
        }
    }
    return [bpm,root,scale,song];

}
function noteFreq(root,n){return root*Math.pow(2,n/12);}
function playTone(freq,duration,volume,type,when,attack=.008,release=.04,detune=0){
    if(!audioCtx)return;
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,when);o.detune.setValueAtTime(detune,when);
    g.gain.setValueAtTime(.0001,when);g.gain.linearRampToValueAtTime(volume,when+attack);
    g.gain.exponentialRampToValueAtTime(.0001,when+Math.max(attack+.01,duration-release));
    o.connect(g);g.connect(musicBus||audioCtx.destination);o.start(when);o.stop(when+duration+.03);
}
function noiseHit(when,volume,duration){
    if(!audioCtx)return;
    const buffer=audioCtx.createBuffer(1,Math.max(1,Math.floor(audioCtx.sampleRate*duration)),audioCtx.sampleRate),data=buffer.getChannelData(0);
    for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,2.4);
    const src=audioCtx.createBufferSource(),g=audioCtx.createGain();src.buffer=buffer;
    g.gain.setValueAtTime(volume,when);g.gain.exponentialRampToValueAtTime(.0001,when+duration);
    src.connect(g);g.connect(musicBus||audioCtx.destination);src.start(when);
}
function playKick(when,v=.07){playTone(150,.17,v,"sine",when,.002,.08);}
function playSnare(when,v=.035){noiseHit(when,v,.12);}
function playHat(when,v=.014){noiseHit(when,v,.045);}
function playTom(when,v=.028){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="triangle";o.frequency.setValueAtTime(180,when);o.frequency.exponentialRampToValueAtTime(80,when+.11);g.gain.setValueAtTime(v,when);g.gain.exponentialRampToValueAtTime(.0001,when+.13);o.connect(g);g.connect(musicBus||audioCtx.destination);o.start(when);o.stop(when+.15);}
function playPluck(freq,when,v=.025){playTone(freq,.16,v,"square",when,.002,.09);playTone(freq*2,.10,v*.28,"triangle",when,.002,.06);}
function playArp(freq,duration,v,when){playTone(freq,duration,v,"square",when,.003,.025,-5);playTone(freq,duration,v*.35,"sawtooth",when,.003,.025,5);}

function stopMusic(){
    musicGeneration++;
    if(musicTimer){clearInterval(musicTimer);musicTimer=null;}
    currentMusicKey="";
    if(audioCtx&&musicBus){
        const oldBus=musicBus;
        const now=audioCtx.currentTime;
        oldBus.gain.cancelScheduledValues(now);
        oldBus.gain.setValueAtTime(Math.max(.0001,oldBus.gain.value),now);
        oldBus.gain.exponentialRampToValueAtTime(.0001,now+.035);
        setTimeout(()=>{try{oldBus.disconnect();}catch(e){}},80);
    }
    musicBus=null;
}

function startMusic(theme,key){
    desiredMusicTheme=theme;desiredMusicKey=key;
    if(!ensureAudio())return;
    if(currentMusicKey===key&&musicTimer)return;
    stopMusic();currentMusicKey=key;musicStep=0;
    musicBus=audioCtx.createGain();
    musicBus.gain.setValueAtTime(.0001,audioCtx.currentTime);
    musicBus.gain.exponentialRampToValueAtTime(.32,audioCtx.currentTime+.045);
    musicBus.connect(audioCtx.destination);
    const gen=musicGeneration;
    const [bpm,root,scale,melody]=theme;
    const bossIndex=key.startsWith("boss")?parseInt(key.slice(4),10):-1;
    const stepSec=60/bpm/4;
    // Different bosses deliberately occupy different pitch registers.
    // This makes some themes bright/high and others deep/low.
    const register=[0,12,-12,0,24,-24,12,-12,0,24,-12,12,-24,0,24,-12,12,-24,0,24,-12,12,-24,0,12,-12][Math.max(0,bossIndex)%26]||0;
    const leadType=["square","triangle","sawtooth","square","triangle"][Math.max(0,bossIndex)%5];
    let nextTime=audioCtx.currentTime+.05;
    let scheduled=0;
    function scheduleStep(s,when){
        const idx=melody[s%melody.length];
        const section=Math.floor(s/melody.length)%64;
        const beat=s%16;
        const d=stepSec;
        const highSection=(section===3||section===7||section===11||section===15);
        const leadOct=(highSection?12:0)+register;
        const lead=noteFreq(root,scale[idx%scale.length]+leadOct);
        const bass=noteFreq(root,scale[Math.floor(s/4)%scale.length]-12+Math.floor(register/24)*12);
        const chord=noteFreq(root,scale[(Math.floor(s/8)*2+section)%scale.length]+register/2+12);
        const arp=noteFreq(root,scale[(s*3+section+Math.max(0,bossIndex))%scale.length]+12+register/2);

        // Every theme gets a slightly different musical texture.
        if(s%2===0 || section%4!==1) playTone(lead,d*1.35,.052,leadType,when,.004,.05);
        if(s%4===2) playPluck(noteFreq(root,scale[(idx+2+section+bossIndex)%scale.length]+12+register/2),when,.022);
        if(s%8===0){
            playTone(chord,d*7,.018,"triangle",when,.025,.15);
            if(bossIndex%3!==0) playTone(chord*1.5,d*5,.008,"sawtooth",when,.02,.12,7);
        }
        if(s%4===0) playTone(bass,d*3.2,.045,"triangle",when,.008,.08);
        if(s%2===1 || bossIndex%4===0) playArp(arp,d*.72,.021,when);
        if(beat===0||beat===8||(section%4===3&&beat===14))playKick(when,.065+(bossIndex%3)*.006);
        if(beat===4||beat===12)playSnare(when,.032);
        if(s%2===0)playHat(when,.012);
        if(beat===10||(section%4===3&&beat===15))playTom(when,.026);

        // Special, unmistakable Sniper theme layer.
        if(bossIndex===0){
            const sniper=[0,0,3,5,7,5,3,2,0,3,7,10,8,7,5,3,2,5,9,12,10,9,7,5,3,7,10,14,12,10,8,7];
            const sn=sniper[s%sniper.length];
            playTone(noteFreq(root,scale[sn%scale.length]+(sn>=10?24:12)),d*.72,.095,"square",when,.002,.03,s%3===0?-8:8);
            if(s%2===0)playTone(noteFreq(root,scale[(sn+2)%scale.length]-12),d*.9,.05,"triangle",when,.004,.06);
            if(s%4===1)playTone(noteFreq(root,scale[(sn+4)%scale.length]+24),d*.38,.045,"sawtooth",when,.001,.018);
            if(s%4===0)playKick(when,.09);
        }
    }
    function scheduler(){
        if(gen!==musicGeneration||currentMusicKey!==key){if(musicTimer){clearInterval(musicTimer);musicTimer=null;}return;}
        if(!audioCtx||audioCtx.state!=="running")return;
        while(nextTime<audioCtx.currentTime+2.5){scheduleStep(scheduled,nextTime);scheduled++;nextTime+=stepSec;musicStep=scheduled%melody.length;}
    }
    scheduler();
    musicTimer=setInterval(scheduler,70);
}

// The canvas keeps its 900x700 internal game resolution, but automatically
// scales to the detected screen width/height without stretching.
function fitCanvasToScreen(){
    // Fit the complete canvas (including its border) inside the viewport
    // while preserving the exact 900:700 game aspect ratio.
    const maxW=Math.max(1,window.innerWidth-8);
    const maxH=Math.max(1,window.innerHeight-8);
    const scale=Math.min(1,maxW/900,maxH/700);
    canvas.style.width=Math.floor(900*scale)+"px";
    canvas.style.height=Math.floor(700*scale)+"px";
}

function getAngleToPlayer(origin,leadFactor=0){

    const targetX=player.x+(player.vx||0)*leadFactor;
    const targetY=player.y+(player.vy||0)*leadFactor;

    return Math.atan2(
        targetY-origin.y,
        targetX-origin.x
    );
}

function fireBullet(
    x,y,angle,speed,color,size=4,bounce=0,damage=5
){
    enemyBullets.push({
        x,y,
        dx:Math.cos(angle),
        dy:Math.sin(angle),
        speed,
        color,
        size,
        bounce,
        damage
    });
}

function aimSpread(
    origin,
    count,
    spread,
    speed,
    color,
    size=5,
    damage=5
){

    const base=getAngleToPlayer(origin,8);

    for(let i=0;i<count;i++){

        const offset=
            count===1
            ?0
            :(i-(count-1)/2)*spread;

        fireBullet(
            origin.x,
            origin.y,
            base+offset,
            speed,
            color,
            size,
            0,
            damage
        );
    }
}

function hazardHit(h,px=player.x,py=player.y){
    if(h.type==='lightning') return Math.abs(px-h.x)<h.width/2 && Math.abs(py-h.y)<h.height/2;
    if(h.type==='ring') return Math.abs(Math.hypot(px-h.x,py-h.y)-h.r)<h.thickness;
    if(h.type==='beam'){
        const dx=px-h.x,dy=py-h.y,c=Math.cos(h.angle),ss=Math.sin(h.angle);
        return Math.abs(dx*ss-dy*c)<h.width/2 && dx*c+dy*ss>0 && dx*c+dy*ss<h.length;
    }
    if(h.type==='fire') return Math.hypot(px-h.x,py-h.y)<h.r;
    if(h.type==='slow') return Math.hypot(px-h.x,py-h.y)<h.r;
    if(h.type==='gravity') return Math.hypot(px-h.x,py-h.y)<h.r;
    if(h.type==='sweep') return Math.abs(py-(h.y+h.amp*Math.sin(h.timer*h.freq)))<h.width/2;
    if(h.type==='meteor') return Math.hypot(px-h.x,py-h.y)<h.r;
    if(h.type==='spikes') return px>h.x-h.w/2 && px<h.x+h.w/2 && py>h.y-h.h/2 && py<h.y+h.h/2;
    if(h.type==='blade') return Math.hypot(px-h.x,py-h.y)<h.r;
    if(h.type==='wall') return px>h.x-h.w/2 && px<h.x+h.w/2 && py>h.y-h.h/2 && py<h.y+h.h/2;
    if(h.type==='mine') return Math.hypot(px-h.x,py-h.y)<h.r;
    if(h.type==='blink') return Math.hypot(px-h.x,py-h.y)<h.r;
    if(h.type==='freeze') return Math.hypot(px-h.x,py-h.y)<h.r;
    if(h.type==='shrink') return px<h.x || px>canvas.width-h.x || py<h.x || py>canvas.height-h.x;
    if(h.type==='crossbeam'){
        const a=h.angle, c=Math.cos(a), ss=Math.sin(a), dx=px-h.x,dy=py-h.y;
        return Math.abs(dx*ss-dy*c)<18 || Math.abs(dx*c+dy*ss)<18;
    }
    return false;
}

function updateBossHazards(){
    for(let i=bossHazards.length-1;i>=0;i--){
        const h=bossHazards[i];
        h.timer++;
        if(h.hitCooldown>0) h.hitCooldown--;
        h.angle+=h.spin;
        h.x+=h.vx; h.y+=h.vy;
        if(h.type==='gravity' && h.timer>h.warning){
            const dx=h.x-player.x,dy=h.y-player.y,d=Math.hypot(dx,dy)||1;
            if(d<h.r) { player.x+=dx/d*1.7; player.y+=dy/d*1.7; }
        }
        if(h.type==='blade' && (h.x<30||h.x>870)) h.vx*=-1;
        if(h.type==='blade' && (h.y<30||h.y>670)) h.vy*=-1;
        if(h.type==='wall' && h.gap!=null){
            // The wall is solid except for a moving-sized opening around the gap.
            h.holeY=h.gap+Math.sin(h.timer*.035)*150;
        }
        if(h.timer>h.warning && h.hitCooldown===0 && hazardHit(h)){
            hurtPlayer(h.damage);
            h.hitCooldown=35;
        }
        if(h.timer>=h.life) bossHazards.splice(i,1);
    }
}

function drawBossHazards(){
    bossHazards.forEach(h=>{
        const active=h.timer>=h.warning;
        const pulse=1+Math.sin(h.timer*.25)*.12;
        ctx.save();
        ctx.globalAlpha=active?0.8:0.35+(Math.sin(h.timer*.3)*.15);
        ctx.strokeStyle=h.color; ctx.fillStyle=h.color; ctx.shadowColor=h.color; ctx.shadowBlur=active?18:8;
        if(h.type==='lightning'){
            ctx.fillRect(h.x-h.width/2,0,h.width,canvas.height);
            if(!active){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(h.x-h.width/2,0,h.width,canvas.height);}
        }else if(h.type==='ring'){
            ctx.lineWidth=h.thickness; ctx.beginPath(); ctx.arc(h.x,h.y,h.r,0,Math.PI*2); ctx.stroke();
        }else if(h.type==='beam'){
            ctx.translate(h.x,h.y);ctx.rotate(h.angle);ctx.fillRect(0,-h.width/2,h.length,h.width);
        }else if(h.type==='fire'||h.type==='slow'||h.type==='gravity'||h.type==='meteor'||h.type==='mine'||h.type==='blink'||h.type==='freeze'){
            ctx.beginPath();ctx.arc(h.x,h.y,h.r*pulse,0,Math.PI*2);ctx.fill();
            ctx.globalAlpha=0.55;ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,Math.PI*2);ctx.stroke();
        }else if(h.type==='sweep'){
            const yy=h.y+h.amp*Math.sin(h.timer*h.freq);ctx.fillRect(0,yy-h.width/2,canvas.width,h.width);
        }else if(h.type==='spikes'){
            ctx.fillRect(h.x-h.w/2,h.y-h.h/2,h.w,h.h);
            ctx.globalAlpha=.9;ctx.strokeRect(h.x-h.w/2,h.y-h.h/2,h.w,h.h);
        }else if(h.type==='blade'){
            ctx.translate(h.x,h.y);ctx.rotate(h.timer*.12);ctx.beginPath();for(let k=0;k<8;k++){const a=k*Math.PI/4;ctx.lineTo(Math.cos(a)*(k%2?h.r*.35:h.r),Math.sin(a)*(k%2?h.r*.35:h.r));}ctx.closePath();ctx.fill();
        }else if(h.type==='wall'){
            const hole=h.holeY??h.gap;ctx.fillRect(h.x-h.w/2,h.y-h.h/2,h.w,hole-h.h/2-70);ctx.fillRect(h.x-h.w/2,hole+70-h.h/2,h.w,h.h-(hole-h.h/2-70));
        }else if(h.type==='shrink'){
            const inset=h.x+Math.sin(h.timer*.05)*8;ctx.lineWidth=12;ctx.strokeRect(inset,inset,canvas.width-inset*2,canvas.height-inset*2);
        }else if(h.type==='crossbeam'){
            ctx.translate(h.x,h.y);ctx.rotate(h.angle);ctx.fillRect(-450,-18,900,36);ctx.rotate(Math.PI/2);ctx.fillRect(-450,-18,900,36);
        }
        // Visual warning only: no warning text.
        ctx.restore();
    });
}

/* =========================================================
   MINION SPAWNING
========================================================= */

function spawnMinion(typeIndex=currentBossIndex){

    if(!boss && !sandboxMode)
        return;

    const type=minionTypes[typeIndex];

    if(!type)
        return;

    let x=0;
    let y=0;

    const side=Math.floor(Math.random()*4);

    if(side===0){
        x=-25;
        y=Math.random()*canvas.height;
    }

    if(side===1){
        x=canvas.width+25;
        y=Math.random()*canvas.height;
    }

    if(side===2){
        x=Math.random()*canvas.width;
        y=-25;
    }

    if(side===3){
        x=Math.random()*canvas.width;
        y=canvas.height+25;
    }

    const scale=
        currentBossIndex>=15
        ?1.12
        :1;

    minions.push({

        ...type,

        x:x,
        y:y,

        hp:Math.round(type.hp*scale),
        maxHp:Math.round(type.hp*scale),

        timer:0,
        contactCooldown:0,
        splitDone:false,

        angle:Math.random()*Math.PI*2,
        targetX:x,
        targetY:y,

        dx:Math.cos(Math.random()*Math.PI*2),
        dy:Math.sin(Math.random()*Math.PI*2),
        warningTimer:0
    });
}


/* =========================================================
   MINION BULLET HELPERS
========================================================= */

function minionShoot(m){

    fireBullet(
        m.x,
        m.y,
        getAngleToPlayer(m,6),
        5.5,
        m.color,
        5,
        0,
        5
    );
}


/* =========================================================
   MINION UPDATE
========================================================= */

function updateMinion(m){

    m.timer++;

    if(m.warningTimer>0)
        m.warningTimer--;

    if(m.contactCooldown>0)
        m.contactCooldown--;


    /* 1 - SNIPER */

    if(m.kind==="sniper"){

        m.y+=(player.y-m.y)*.002;

        if(m.timer%105===0){

            fireBullet(
                m.x,
                m.y,
                getAngleToPlayer(m,15),
                8.5,
                m.color,
                5,
                0,
                7
            );
        }
    }


    /* 2 - PULSAR */

    else if(m.kind==="pulsar"){

        m.angle+=.035;

        m.x+=(450+Math.cos(m.angle)*300-m.x)*.012;
        m.y+=(180+Math.sin(m.angle)*120-m.y)*.012;

        if(m.timer%75===0){

            for(let i=0;i<4;i++){

                fireBullet(
                    m.x,
                    m.y,
                    m.angle+i*Math.PI/2,
                    4.5,
                    m.color,
                    4
                );
            }
        }
    }


    /* 3 - GHOST */

    else if(m.kind==="ghost"){

        m.x+=Math.cos(m.timer*.04)*1.2;
        m.y+=(player.y-m.y)*.001;

        if(m.timer%90===0){

            fireBullet(
                m.x,
                m.y,
                getAngleToPlayer(m),
                6,
                m.color,
                6,
                0,
                7
            );
        }
    }


    /* 4 - TWIN */

    else if(m.kind==="twin"){

        m.x+=(player.x-m.x)*.002;

        if(m.timer%75===0){

            const a=getAngleToPlayer(m);

            fireBullet(
                m.x,m.y,a-.22,
                6,m.color,5
            );

            fireBullet(
                m.x,m.y,a+.22,
                6,m.color,5
            );
        }
    }


    /* 5 - WALL */

    else if(m.kind==="wall"){

        m.x+=m.speed;

        if(m.x>canvas.width+30)
            m.x=-30;

        if(m.timer%95===0){

            fireBullet(
                m.x,
                0,
                Math.PI/2,
                4.5,
                m.color,
                7
            );
        }

        /* Mini walls: these are NOT enemies. They are compact walls made
           entirely from bullets, moving horizontally and vertically. */
        if(m.timer%150===0){

            const miniCount=8;
            const miniGap=canvas.height/(miniCount+1);

            /* Horizontal mini wall: a vertical line of bullets moving right. */
            for(let i=1;i<=miniCount;i++){
                fireBullet(
                    -8,
                    i*miniGap,
                    0,
                    3.2,
                    m.color,
                    5,
                    0,
                    3
                );
            }

            const miniGapX=canvas.width/(miniCount+1);

            /* Vertical mini wall: a horizontal line of bullets moving down. */
            for(let i=1;i<=miniCount;i++){
                fireBullet(
                    i*miniGapX,
                    -8,
                    Math.PI/2,
                    3.2,
                    m.color,
                    5,
                    0,
                    3
                );
            }
        }
    }



    /* 6 - BOUNCER */

    else if(m.kind==="bouncer"){

        m.x+=m.dx*m.speed;
        m.y+=m.dy*m.speed;

        if(m.x<20||m.x>880)
            m.dx*=-1;

        if(m.y<20||m.y>680)
            m.dy*=-1;

        if(m.timer%100===0){

            for(let i=0;i<4;i++){

                fireBullet(
                    m.x,
                    m.y,
                    getAngleToPlayer(m)+
                    (i-1.5)*.2,
                    5.5,
                    m.color,
                    5
                );
            }
        }
    }


    /* 7 - GRAVITY */

    else if(m.kind==="gravity"){

        const dx=m.x-player.x;
        const dy=m.y-player.y;
        const d=Math.hypot(dx,dy);

        if(d<250){

            player.x+=dx/400;
            player.y+=dy/400;
        }

        m.x+=(player.x-m.x)*.002;
        m.y+=(player.y-m.y)*.002;

        if(m.timer%85===0){

            fireBullet(
                m.x,m.y,
                getAngleToPlayer(m),
                5,
                m.color,
                6,
                0,
                6
            );
        }
    }


    /* 8 - CHRONO */

    else if(m.kind==="chrono"){

        m.y+=Math.sin(m.timer*.05)*.7;

        if(m.timer%100===0){

            m.x=Math.random()*760+70;
            m.y=Math.random()*300+50;

            for(let i=0;i<6;i++){

                fireBullet(
                    m.x,
                    m.y,
                    i*Math.PI/3,
                    4,
                    m.color,
                    4
                );
            }
        }
    }


    /* 9 - HYDRA */

    else if(m.kind==="hydra"){

        m.x+=(player.x-m.x)*.003;

        if(m.timer%80===0){

            aimSpread(
                m,
                3,
                .25,
                5.5,
                m.color,
                5,
                6
            );
        }
    }


    /* 10 - STRIKE */

    else if(m.kind==="strike"){

        m.x+=(player.x-m.x)*.002;

        if(m.timer%115===0){

            fireBullet(
                player.x,
                0,
                Math.PI/2,
                10,
                m.color,
                9,
                0,
                9
            );
        }
    }


    /* 11 - VOID */

    else if(m.kind==="void"){

        m.angle+=.025;

        m.x=450+Math.cos(m.angle)*260;
        m.y=230+Math.sin(m.angle)*130;

        if(m.timer%90===0){

            for(let i=0;i<6;i++){

                fireBullet(
                    m.x,
                    m.y,
                    i*Math.PI/3,
                    4,
                    m.color,
                    5
                );
            }
        }
    }


    /* 12 - GLITCH */

    else if(m.kind==="glitch"){

        if(m.timer%55===0){

            m.x=Math.random()*760+70;
            m.y=Math.random()*350+50;

            minionShoot(m);
        }
    }


    /* 13 - RAIN */

    else if(m.kind==="rain"){

        if(m.timer%25===0){

            fireBullet(
                m.x,
                m.y,
                Math.PI/2,
                5.5,
                m.color,
                4
            );
        }

        m.x+=Math.sin(m.timer*.03)*1.5;
    }


    /* 14 - STAR */

    else if(m.kind==="star"){

        m.angle+=.05;

        if(m.timer%50===0){

            for(let i=0;i<6;i++){

                fireBullet(
                    m.x,
                    m.y,
                    m.angle+i*Math.PI/3,
                    5,
                    m.color,
                    5
                );
            }
        }
    }


    /* 15 - OMEGA */

    else if(m.kind==="omega"){

        m.x+=(player.x-m.x)*.004;
        m.y+=(player.y-180-m.y)*.003;

        if(m.timer%55===0){

            for(let i=0;i<6;i++){

                fireBullet(
                    m.x,
                    m.y,
                    i*Math.PI/3+m.timer*.04,
                    5.5,
                    m.color,
                    5,
                    0,
                    6
                );
            }
        }

        if(m.timer%110===0){

            minionShoot(m);
        }
    }


    /* 16 - MINI MINELAYER */

    else if(m.kind==="minelayer"){

        m.x+=Math.sin(m.timer*.025)*1.5;

        if(m.timer%90===0){

            enemyBullets.push({

                x:m.x,
                y:m.y,

                dx:0,
                dy:0,

                speed:0,

                color:m.color,
                size:11,

                bounce:0,
                damage:9
            });
        }

        if(m.timer%100===0){

            minionShoot(m);
        }
    }


    /* 17 - SPLITTER */

    else if(m.kind==="splitter"){

        m.x+=(player.x-m.x)*.002;

        if(m.timer%75===0){

            aimSpread(
                m,
                3,
                .3,
                5,
                m.color,
                5,
                6
            );
        }
    }


    /* 18 - HUNTER */

    else if(m.kind==="hunter"){

        const dx=player.x-m.x;
        const dy=player.y-m.y;
        const d=Math.hypot(dx,dy)||1;

        m.x+=dx/d*m.speed*.45;
        m.y+=dy/d*m.speed*.45;

        if(m.timer%65===0){

            fireBullet(
                m.x,
                m.y,
                getAngleToPlayer(m,10),
                6,
                m.color,
                6,
                0,
                7
            );
        }
    }


    /* 19 - HELIX */

    else if(m.kind==="helix"){

        if(m.timer%10===0){

            fireBullet(
                m.x,
                m.y,
                m.timer*.15,
                5,
                m.color,
                4
            );
        }

        m.x+=(player.x-m.x)*.0015;
    }


    /* 20 - GRID */

    else if(m.kind==="grid"){

        /* ATTACK WARNING: the grid flashes before firing */
        if(m.timer%100===55)
            m.warningTimer=45;

        if(m.timer%100===0){

            fireBullet(
                m.x,
                0,
                Math.PI/2,
                5,
                m.color,
                6
            );

            fireBullet(
                0,
                m.y,
                0,
                5,
                m.color,
                6
            );

            m.warningTimer=0;
        }
    }


    /* 21 - TELEPORT */

    else if(m.kind==="teleport"){

        if(m.timer%85===0){

            m.x=Math.random()*760+70;
            m.y=Math.random()*300+50;

            aimSpread(
                m,
                3,
                .18,
                6.5,
                m.color,
                5,
                6
            );
        }
    }


    /* 22 - FIREWORK */

    else if(m.kind==="firework"){

        if(m.timer%90===0){

            for(let i=0;i<5;i++){

                fireBullet(
                    m.x,
                    m.y,
                    i*Math.PI*2/5,
                    3.2,
                    m.color,
                    7,
                    0,
                    5
                );
            }
        }

        if(m.timer%130===0){

            minionShoot(m);
        }
    }


    /* 23 - TIDAL */

    else if(m.kind==="tidal"){

        m.y+=Math.sin(m.timer*.035)*2;

        if(m.timer%100===0){

            fireBullet(
                0,
                m.y,
                0,
                5.5,
                m.color,
                7
            );

            fireBullet(
                900,
                m.y,
                Math.PI,
                5.5,
                m.color,
                7
            );
        }
    }


    /* 24 - MIRROR */

    else if(m.kind==="mirror"){

        m.x+=(player.x-m.x)*.003;
        m.y+=(player.y-m.y)*.001;

        if(m.timer%90===0){

            const a=getAngleToPlayer(m);

            fireBullet(
                m.x,m.y,
                a,
                6,
                m.color,
                6,
                0,
                7
            );

            fireBullet(
                m.x,m.y,
                a+Math.PI,
                4,
                m.color,
                5
            );
        }
    }


    /* 25 - ABSOLUTE */

    else if(m.kind==="absolute"){

        m.x+=Math.sin(m.timer*.025)*1.5;
        m.y+=Math.cos(m.timer*.03)*1.2;

        if(m.timer%55===0){

            for(let i=0;i<6;i++){

                fireBullet(
                    m.x,
                    m.y,
                    i*Math.PI/3+m.timer*.08,
                    5.5,
                    m.color,
                    6,
                    0,
                    7
                );
            }
        }

        if(m.timer%100===0){

            aimSpread(
                m,
                3,
                .16,
                7,
                m.color,
                6,
                8
            );
        }
    }


    /* KEEP MINIONS INSIDE A REASONABLE AREA */

    m.x=Math.max(-60,Math.min(canvas.width+60,m.x));
    m.y=Math.max(-60,Math.min(canvas.height+60,m.y));


    /* MINION CONTACT DAMAGE */

    if(
        m.contactCooldown<=0 &&
        Math.hypot(
            m.x-player.x,
            m.y-player.y
        )<
        m.size/2+player.size/2
    ){

        if(player.shield>0)
            player.shield--;
        else
            player.hp-=7;

        m.contactCooldown=45;

        updateUI();

        if(player.hp<=0)
            playerDefeated();
    }
}


/* =========================================================
   MINION DEATH
========================================================= */

function killMinion(index){

    const m=minions[index];

    if(
        m.kind==="splitter" &&
        !m.splitDone
    ){

        for(let i=0;i<2;i++){

            minions.push({

                name:"SPLITTER FRAGMENT",
                kind:"splitFragment",
                color:m.color,
                size:11,
                hp:12,
                maxHp:12,
                speed:2.8,

                x:m.x+(i===0?-12:12),
                y:m.y,

                timer:0,
                contactCooldown:0,
                splitDone:true,

                angle:Math.random()*Math.PI*2
            });
        }
    }

    minions.splice(index,1);
}


/* =========================================================
   SPLITTER FRAGMENTS
========================================================= */

function updateSplitFragment(m){

    const dx=player.x-m.x;
    const dy=player.y-m.y;
    const d=Math.hypot(dx,dy)||1;

    m.x+=dx/d*1.9;
    m.y+=dy/d*1.9;

    m.timer++;

    if(m.timer%70===0){

        fireBullet(
            m.x,
            m.y,
            getAngleToPlayer(m),
            5,
            m.color,
            4,
            0,
            4
        );
    }

    if(m.contactCooldown>0)
        m.contactCooldown--;

    if(
        m.contactCooldown<=0 &&
        Math.hypot(m.x-player.x,m.y-player.y)
        <
        m.size/2+player.size/2
    ){

        if(player.shield>0)
            player.shield--;
        else
            player.hp-=5;

        m.contactCooldown=45;

        updateUI();

        if(player.hp<=0)
            playerDefeated();
    }
}

/* =========================================================
   SHOOTING
========================================================= */

function shoot(){

    if(
        !gameActive||
        waitingForPowerup||
        player.fireCooldown>0
    )
        return;

    const rect=
        canvas.getBoundingClientRect();

    const scaleX=canvas.width/rect.width;
    const scaleY=canvas.height/rect.height;

    const mouseX=
        (lastMouseX-rect.left)*scaleX;

    const mouseY=
        (lastMouseY-rect.top)*scaleY;

    const baseAngle=
        Math.atan2(
            mouseY-player.y,
            mouseX-player.x
        );

    const total=player.shots;

    for(let i=0;i<total;i++){

        let angle=baseAngle;

        if(total>1){

            angle=
                baseAngle+
                (i-(total-1)/2)*
                player.shotSpread;
        }

        bullets.push({

            x:player.x,
            y:player.y,

            speed:12,

            dx:Math.cos(angle),
            dy:Math.sin(angle),

            damage:player.damage,
            pierce:player.piercing
        });
    }

    player.fireCooldown=
        player.fireRate;
}


function performDash(){
    if(
        player.dashPower<=0 ||
        player.dashCooldown>0 ||
        !gameActive ||
        waitingForPowerup
    ) return;

    let dx=0;
    let dy=0;

    if(mobileEnabled && (mobileMoveX!==0 || mobileMoveY!==0)){
        dx=mobileMoveX;
        dy=mobileMoveY;
    }else{
        if(keys["w"]||keys["arrowup"])dy--;
        if(keys["s"]||keys["arrowdown"])dy++;
        if(keys["a"]||keys["arrowleft"])dx--;
        if(keys["d"]||keys["arrowright"])dx++;
    }

    if(dx===0&&dy===0) dy=-1;

    const length=Math.hypot(dx,dy)||1;
    player.x+=dx/length*100;
    player.y+=dy/length*100;

    player.x=Math.max(player.size,Math.min(canvas.width-player.size,player.x));
    player.y=Math.max(player.size,Math.min(canvas.height-player.size,player.y));

    player.dashCooldown=player.dashPower===2?45:70;
}

/* =========================================================
   UI
========================================================= */

function updateUI(){

    uiHp.textContent=
        Math.max(
            0,
            Math.ceil(player.hp)
        );

    let displayedBossHP=0;

    if(sandboxMode){
        displayedBossHP=sandboxBosses.reduce((sum,b)=>sum+Math.max(0,b.hp),0);
    }else{
        displayedBossHP=boss?boss.hp:0;
    }

    uiBhp.textContent=Math.max(0,Math.ceil(displayedBossHP));

    uiPower.textContent=
        player.damage;
}


/* =========================================================
   UPDATE
========================================================= */

function update(){

    if(
        !gameActive||
        waitingForPowerup
    )
        return;

    player.vx=0;
    player.vy=0;

    if(mobileEnabled){
        player.x+=mobileMoveX*player.speed;
        player.y+=mobileMoveY*player.speed;
        player.vx=mobileMoveX*player.speed;
        player.vy=mobileMoveY*player.speed;
    }

    if(keys["w"]||keys["arrowup"]){

        player.y-=player.speed;
        player.vy=-player.speed;
    }

    if(keys["s"]||keys["arrowdown"]){

        player.y+=player.speed;
        player.vy=player.speed;
    }

    if(keys["a"]||keys["arrowleft"]){

        player.x-=player.speed;
        player.vx=-player.speed;
    }

    if(keys["d"]||keys["arrowright"]){

        player.x+=player.speed;
        player.vx=player.speed;
    }

    player.x=
        Math.max(
            player.size,
            Math.min(
                canvas.width-player.size,
                player.x
            )
        );

    player.y=
        Math.max(
            player.size,
            Math.min(
                canvas.height-player.size,
                player.y
            )
        );

    if(player.fireCooldown>0)
        player.fireCooldown--;

    if(player.dashCooldown>0)
        player.dashCooldown--;

    if(mouseDown||mobileFireDown)
        shoot();


    /* =====================================================
       PLAYER BULLETS
    ===================================================== */

    for(let i=bullets.length-1;i>=0;i--){

        const b=bullets[i];

        b.x+=b.dx*b.speed;
        b.y+=b.dy*b.speed;

        if(
            b.x<-30||
            b.x>canvas.width+30||
            b.y<-30||
            b.y>canvas.height+30
        ){

            bullets.splice(i,1);
        }
    }


    /* =====================================================
       BOSSES
    ===================================================== */

    if(sandboxMode){

        /* Sandbox allows unlimited bosses at once. */
        for(let si=sandboxBosses.length-1;si>=0;si--){

            const sb=sandboxBosses[si];

            sb.timer++;
            sb.update();

            /* Player bullets can hit any summoned boss. */
            for(let bi=bullets.length-1;bi>=0;bi--){

                const b=bullets[bi];

                if(
                    Math.hypot(b.x-sb.x,b.y-sb.y)<
                    sb.size/2
                ){

                    sb.hp-=b.damage;

                    if(b.pierce>0){
                        b.pierce--;
                    }else{
                        bullets.splice(bi,1);
                    }

                    if(sb.hp<=0){
                        sandboxBosses.splice(si,1);
                        break;
                    }
                }
            }
        }

        boss=sandboxBosses.length
            ?sandboxBosses[sandboxBosses.length-1]
            :null;

        updateUI();

    }else if(boss){

        boss.timer++;
        boss.update();

        /* RANDOM MINION SPAWNING */

        const spawnInterval=currentBossIndex<15?240:185;
        const maxMinions=currentBossIndex<15?3:4;
        const unlimitedMinions=currentBossIndex===0;

        if(
            boss.timer>100 &&
            boss.timer%spawnInterval===0 &&
            (unlimitedMinions || minions.length<maxMinions)
        ){
            spawnMinion();
        }

        /* BOSS COLLISION */

        for(let bi=bullets.length-1;bi>=0;bi--){

            const b=bullets[bi];

            if(
                Math.hypot(b.x-boss.x,b.y-boss.y)<
                boss.size/2
            ){

                boss.hp-=b.damage;

                if(b.pierce>0){
                    b.pierce--;
                }else{
                    bullets.splice(bi,1);
                }

                updateUI();

                if(boss.hp<=0){

                    bullets=[];
                    enemyBullets=[];
                    minions=[];
                    bossHazards=[];

                    currentBossIndex++;

                    if(currentBossIndex>=bosses.length){
                        gameActive=false;
                        alert(
                            "GOD SLAYER!\n\n"+
                            "You cleared all 40 bosses!"
                        );
                        return;
                    }

                    choosePowerups();
                    return;
                }
            }
        }
    }


    /* =====================================================
       NEW BOSS ARENA HAZARDS
    ===================================================== */

    updateBossHazards();

    /* =====================================================
       MINIONS
    ===================================================== */

    for(let mi=minions.length-1;mi>=0;mi--){

        const m=minions[mi];

        if(m.kind==="splitFragment")
            updateSplitFragment(m);
        else
            updateMinion(m);


        /* PLAYER BULLET VS MINION */

        for(let bi=bullets.length-1;bi>=0;bi--){

            const b=bullets[bi];

            if(
                Math.hypot(
                    b.x-m.x,
                    b.y-m.y
                )<
                m.size/2+3
            ){

                m.hp-=b.damage;

                if(b.pierce>0){

                    b.pierce--;

                }else{

                    bullets.splice(bi,1);
                }

                if(m.hp<=0){

                    killMinion(mi);
                    break;
                }
            }
        }
    }


    /* =====================================================
       ENEMY BULLETS
    ===================================================== */

    for(let i=enemyBullets.length-1;i>=0;i--){

        const b=enemyBullets[i];


        /* STATIONARY MINES / NEON GHOST BOMBS */

        if(b.speed===0){
            if(b.bomb){
                b.timer++;
                const d=Math.hypot(b.x-player.x,b.y-player.y);

                if(d<player.size/2+b.size){
                    if(player.shield>0) player.shield--;
                    else player.hp-=b.damage;
                    enemyBullets.splice(i,1);
                    updateUI();
                    if(player.hp<=0) playerDefeated();
                    continue;
                }

                if(b.timer>=b.fuse){
                    if(d<=b.blastRadius){
                        if(player.shield>0) player.shield--;
                        else player.hp-=b.damage;
                        updateUI();
                        if(player.hp<=0) playerDefeated();
                    }
                    enemyBullets.splice(i,1);
                }
                continue;
            }

            if(Math.hypot(b.x-player.x,b.y-player.y)<player.size/2+b.size){
                if(player.shield>0) player.shield--;
                else player.hp-=b.damage;
                enemyBullets.splice(i,1);
                updateUI();
                if(player.hp<=0) playerDefeated();
            }
            continue;
        }

        b.x+=b.dx*b.speed;
        b.y+=b.dy*b.speed;


        /* BOUNCING */

        if(b.bounce>0){

            if(
                b.x<0||
                b.x>canvas.width
            ){

                b.dx*=-1;
                b.bounce--;
            }

            if(
                b.y<0||
                b.y>canvas.height
            ){

                b.dy*=-1;
                b.bounce--;
            }
        }


        /* PLAYER HIT */

        if(
            Math.hypot(
                b.x-player.x,
                b.y-player.y
            )<
            player.size/2+b.size/2
        ){

            if(player.shield>0){

                player.shield--;

            }else{

                player.hp-=b.damage||5;
            }

            enemyBullets.splice(i,1);

            updateUI();

            if(player.hp<=0){

                playerDefeated();
                return;
            }

            continue;
        }


        /* REMOVE OFFSCREEN */

        if(
            b.x<-100||
            b.x>canvas.width+100||
            b.y<-100||
            b.y>canvas.height+100
        ){

            enemyBullets.splice(i,1);
        }
    }
}


/* =========================================================
   DRAW
========================================================= */

function draw(){

    ctx.fillStyle=
        "rgba(0,0,0,.3)";

    ctx.fillRect(
        0,0,
        canvas.width,
        canvas.height
    );


    /* PLAYER */

    ctx.fillStyle="#0f0";

    ctx.shadowBlur=15;
    ctx.shadowColor="#0f0";

    ctx.fillRect(
        player.x-player.size/2,
        player.y-player.size/2,
        player.size,
        player.size
    );


    /* SHIELD */

    if(player.shield>0){

        ctx.strokeStyle="#00ffff";
        ctx.lineWidth=3;

        ctx.beginPath();

        ctx.arc(
            player.x,
            player.y,
            27,
            0,
            Math.PI*2
        );

        ctx.stroke();

        ctx.fillStyle="#00ffff";
        ctx.font="12px Courier New";

        ctx.fillText(
            "S:"+player.shield,
            player.x+18,
            player.y-20
        );
    }


    /* BOSSES */

    const bossesToDraw=sandboxMode?sandboxBosses:(boss?[boss]:[]);

    for(const db of bossesToDraw){

        ctx.fillStyle=db.color;
        ctx.shadowColor=db.color;
        ctx.shadowBlur=15;

        ctx.fillRect(
            db.x-db.size/2,
            db.y-db.size/2,
            db.size,
            db.size
        );

        ctx.shadowBlur=0;

        /* BOSS HP */
        ctx.fillStyle="#222";
        ctx.fillRect(
            db.x-50,
            db.y-db.size-14,
            100,
            7
        );

        ctx.fillStyle=db.color;
        ctx.fillRect(
            db.x-50,
            db.y-db.size-14,
            Math.max(0,db.hp/db.maxHp*100),
            7
        );
    }


    /* =====================================================
       MINIONS
    ===================================================== */

    minions.forEach(m=>{

        /* GRID DRONE ATTACK WARNING */
        if(m.kind==="grid" && m.warningTimer>0){

            const pulse=0.22+0.28*Math.sin(m.warningTimer*.45)**2;

            ctx.save();
            ctx.globalAlpha=pulse;
            ctx.strokeStyle=m.color;
            ctx.shadowColor=m.color;
            ctx.shadowBlur=14;
            ctx.lineWidth=4;

            ctx.beginPath();
            ctx.moveTo(m.x,0);
            ctx.lineTo(m.x,canvas.height);
            ctx.moveTo(0,m.y);
            ctx.lineTo(canvas.width,m.y);
            ctx.stroke();

            ctx.globalAlpha=0.9;
            ctx.lineWidth=2;
            ctx.stroke();
            ctx.restore();
        }

        ctx.fillStyle=m.color;
        ctx.shadowColor=m.color;
        ctx.shadowBlur=10;

        if(m.kind==="star"){

            ctx.beginPath();

            for(let i=0;i<10;i++){

                const a=
                    m.timer*.04+
                    i*Math.PI/5;

                const r=
                    i%2===0
                    ?m.size
                    :m.size*.45;

                const x=m.x+Math.cos(a)*r;
                const y=m.y+Math.sin(a)*r;

                if(i===0)
                    ctx.moveTo(x,y);
                else
                    ctx.lineTo(x,y);
            }

            ctx.closePath();
            ctx.fill();

        }else if(m.kind==="ghost"){

            ctx.beginPath();

            ctx.arc(
                m.x,
                m.y,
                m.size/2,
                Math.PI,
                0
            );

            ctx.lineTo(
                m.x+m.size/2,
                m.y+m.size/2
            );

            ctx.lineTo(
                m.x,
                m.y+m.size/3
            );

            ctx.lineTo(
                m.x-m.size/2,
                m.y+m.size/2
            );

            ctx.closePath();
            ctx.fill();

        }else if(m.kind==="splitFragment"){

            ctx.beginPath();

            ctx.arc(
                m.x,
                m.y,
                m.size/2,
                0,
                Math.PI*2
            );

            ctx.fill();

        }else{

            ctx.fillRect(
                m.x-m.size/2,
                m.y-m.size/2,
                m.size,
                m.size
            );
        }

        ctx.shadowBlur=0;


        /* MINION HP BAR */

        if(m.hp<m.maxHp){

            ctx.fillStyle="#222";

            ctx.fillRect(
                m.x-m.size/2,
                m.y-m.size/2-7,
                m.size,
                3
            );

            ctx.fillStyle=m.color;

            ctx.fillRect(
                m.x-m.size/2,
                m.y-m.size/2-7,
                Math.max(
                    0,
                    m.hp/m.maxHp*m.size
                ),
                3
            );
        }
    });


    /* =====================================================
       PLAYER PROJECTILES
    ===================================================== */

    bullets.forEach(b=>{

        ctx.fillStyle="#fff";
        ctx.shadowColor="#fff";
        ctx.shadowBlur=5;

        ctx.fillRect(
            b.x-2,
            b.y-2,
            5,
            5
        );
    });


    drawBossHazards();

    /* =====================================================
       ENEMY PROJECTILES
    ===================================================== */

    enemyBullets.forEach(b=>{

        ctx.fillStyle=b.color;
        ctx.shadowColor=b.color;
        ctx.shadowBlur=8;

        if(b.bomb){
            const remaining=Math.max(0,b.fuse-b.timer);
            const pulse=1+Math.sin(b.timer*.25)*.2;

            ctx.beginPath();
            ctx.arc(b.x,b.y,b.size*pulse,0,Math.PI*2);
            ctx.fill();

            ctx.strokeStyle=b.color;
            ctx.lineWidth=2;
            ctx.beginPath();
            ctx.arc(b.x,b.y,b.blastRadius*(1-remaining/b.fuse),0,Math.PI*2);
            ctx.stroke();

            ctx.fillStyle="#fff";
            ctx.font="10px Courier New";
            ctx.fillText(Math.ceil(remaining/60),b.x-3,b.y+4);
        }else{
            ctx.beginPath();
            ctx.arc(b.x,b.y,b.size,0,Math.PI*2);
            ctx.fill();
        }
    });

    ctx.shadowBlur=0;
}

function resetPlayer(){
    player={
        x:450, y:600, size:18, hp:100, maxHp:100, speed:6,
        damage:5, fireRate:10, fireCooldown:0,
        shots:1, shotSpread:.13, piercing:0, shield:0,
        dashPower:0, dashCooldown:0
    };
}


function setMobileEnabled(enabled){
    mobileEnabled=enabled;
    mobileControls.classList.toggle("enabled",enabled);
    mobileToggle.textContent=enabled?"DISABLE MOBILE":"ENABLE MOBILE";
    mobileToggle.style.borderColor=enabled?"#0f0":"#555";
    if(!enabled){
        mobileMoveX=0;
        mobileMoveY=0;
        mobileFireDown=false;
        mobileStick.style.transform="translate(0px,0px)";
        mobileAimStick.style.transform="translate(0px,0px)";
    }
}

function joystickMove(e){
    const r=mobileJoystick.getBoundingClientRect();
    const cx=r.left+r.width/2;
    const cy=r.top+r.height/2;
    let dx=e.clientX-cx;
    let dy=e.clientY-cy;
    const max=44;
    const len=Math.hypot(dx,dy)||1;
    if(len>max){dx=dx/len*max;dy=dy/len*max;}
    mobileMoveX=dx/max;
    mobileMoveY=dy/max;
    mobileStick.style.transform=`translate(${dx}px,${dy}px)`;
}

mobileToggle.onclick=()=>setMobileEnabled(!mobileEnabled);
mobileDashButton.addEventListener("pointerdown",e=>{
    if(!mobileEnabled)return;
    performDash();
    e.preventDefault();
});

mobileJoystick.addEventListener("pointerdown",e=>{
    if(!mobileEnabled)return;
    mobileJoystick.setPointerCapture(e.pointerId);
    joystickMove(e);
    e.preventDefault();
});
mobileJoystick.addEventListener("pointermove",e=>{
    if(!mobileEnabled)return;
    joystickMove(e);
    e.preventDefault();
});
mobileJoystick.addEventListener("pointerup",e=>{
    mobileMoveX=0; mobileMoveY=0; mobileStick.style.transform="translate(0px,0px)";
    e.preventDefault();
});
mobileJoystick.addEventListener("pointercancel",()=>{
    mobileMoveX=0; mobileMoveY=0; mobileStick.style.transform="translate(0px,0px)";
});

function setMobileAim(e){
    const r=mobileAim.getBoundingClientRect();
    const cx=r.left+r.width/2;
    const cy=r.top+r.height/2;
    const dx=e.clientX-cx;
    const dy=e.clientY-cy;
    const len=Math.hypot(dx,dy)||1;
    const max=58;
    const useLen=Math.min(len,max);
    const nx=dx/len;
    const ny=dy/len;
    lastMouseX=player.x+nx*120;
    lastMouseY=player.y+ny*120;
    mobileAimStick.style.transform=`translate(${nx*useLen}px,${ny*useLen}px)`;
}
mobileAim.addEventListener("pointerdown",e=>{
    if(!mobileEnabled)return;
    mobileAim.setPointerCapture(e.pointerId);
    mobileFireDown=true;
    setMobileAim(e);
    e.preventDefault();
});
mobileAim.addEventListener("pointermove",e=>{
    if(!mobileEnabled)return;
    setMobileAim(e);
    e.preventDefault();
});
mobileAim.addEventListener("pointerup",e=>{
    mobileFireDown=false;
    mobileAimStick.style.transform="translate(0px,0px)";
    e.preventDefault();
});
mobileAim.addEventListener("pointercancel",()=>{
    mobileFireDown=false;
    mobileAimStick.style.transform="translate(0px,0px)";
});

function startGame(){
    setMobileEnabled(false);
    document.body.classList.remove("menuOpen");
    sandboxMode=false;
    mainMenu.style.display="none";
    sandboxMenu.style.display="none";
    powerupScreen.style.display="none";
    waitingForPowerup=false;
    currentBossIndex=0;
    resetPlayer();
    bullets=[];
    enemyBullets=[];
    minions=[];
    gameActive=true;
    initBoss();
    updateUI();
}

function startSandbox(){
    setMobileEnabled(false);
    document.body.classList.remove("menuOpen");
    sandboxMode=true;
    mainMenu.style.display="none";
    sandboxMenu.style.display="block";
    powerupScreen.style.display="none";
    waitingForPowerup=false;
    boss=null;
    sandboxBosses=[];
    bullets=[];
    enemyBullets=[];
    minions=[];
    currentBossIndex=0;
    resetPlayer();
    gameActive=true;
    startSandboxMusic();
    updateUI();
}

function spawnSandboxBoss(){
    const index=Number(sandboxBossSelect.value);
    const template=bosses[index];

    /* Each click adds another independent boss. */
    currentBossIndex=index;

    const count=sandboxBosses.length;
    const angle=count*0.9;
    const radius=Math.min(230,60+count*18);

    const newBoss={
        ...template,
        x:450+Math.cos(angle)*radius,
        y:180+Math.sin(angle)*radius,
        timer:0,
        maxHp:template.hp
    };

    newBoss.x=Math.max(newBoss.size,Math.min(canvas.width-newBoss.size,newBoss.x));
    newBoss.y=Math.max(newBoss.size+20,Math.min(canvas.height/2,newBoss.y));

    sandboxBosses.push(newBoss);
    boss=newBoss;
    updateUI();
}

function spawnSandboxEnemy(){
    const index=Number(sandboxEnemySelect.value);
    spawnMinion(index);
}

function clearSandbox(){
    boss=null;
    sandboxBosses=[];
    bullets=[];
    enemyBullets=[];
    minions=[];
    updateUI();
}

function exitToMainMenu(){
    setMobileEnabled(false);
    stopMusic();
    document.body.classList.add("menuOpen");
    sandboxMode=false;
    gameActive=false;
    waitingForPowerup=false;
    boss=null;
    sandboxBosses=[];
    bullets=[];
    enemyBullets=[];
    minions=[];
    sandboxMenu.style.display="none";
    powerupScreen.style.display="none";
    mainMenu.style.display="flex";
    updateUI();
}

startGameButton.onclick=startGame;
startSandboxButton.onclick=startSandbox;
spawnBossButton.onclick=spawnSandboxBoss;
spawnEnemyButton.onclick=spawnSandboxEnemy;
clearSandboxButton.onclick=clearSandbox;
exitSandboxButton.onclick=exitToMainMenu;

fillSandboxMenus();
showMainMenuOnStartup();


/* =========================================================
   LOOP
========================================================= */

function gameLoop(){

    update();
    draw();

    requestAnimationFrame(gameLoop);
}

gameLoop();

</script>
